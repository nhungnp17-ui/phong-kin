const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('phongkin_mute') === '1'; } catch(e){}
  const loops = {};
  function init(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : .55;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const now = () => ac.currentTime;
  function env(g, t0, a, t, v){ g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0+a); g.gain.exponentialRampToValueAtTime(0.0001, t0+t); }
  // âm có cao độ, quét từ f tới f2
  function tone(o){
    const {type='sine', f=440, f2=f, t=.1, v=.2, a=.004, d=0, q=0, bp=0} = o;
    const t0 = now()+d, osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t0); osc.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+t);
    let node = osc;
    if (bp){ const fl = ac.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=bp; fl.Q.value=q||2; osc.connect(fl); node = fl; }
    node.connect(g); g.connect(master); env(g, t0, a, t, v); osc.start(t0); osc.stop(t0+t+.05);
  }
  // tiếng ồn có lọc (gió, va chạm, sột soạt)
  function noise(o){
    const {t=.1, v=.2, f=1000, f2=f, type='bandpass', q=1, a=.004, d=0} = o;
    const t0 = now()+d, src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; src.loop = true; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t0); fl.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+t);
    src.connect(fl); fl.connect(g); g.connect(master); env(g, t0, a, t, v);
    src.start(t0, Math.random()*.5); src.stop(t0+t+.05);
  }

      if (b.floodT < 1.5 && Math.random()<.5) bubbles.push({x:A.L+Math.random()*(A.R-A.L), y:A.floor-4, vy:-40, r:2+Math.random()*2, life:.6});

    case 'vortex': {

      v.a += dt*1.7; const cx=b.x+b.w/2, cy=b.y+b.h/2;

    else if (h.type==='ring'){ h.r += h.v*dt; const d = Math.hypot(px-h.x, py-h.y);

      if (h.x < A.L || h.x > A.R) h.dead = true; }
  }
  b.hz = b.hz.filter(h=>!h.dead);
  if (b.flood > .3 && p.y+p.h > A.floor - 22*b.flood && px > A.L && px < A.R) hurtPlayer(bossDmg(), px + (Math.random()<.5?-1:1));
  if (b.vort){ const cx=b.x+b.w/2, cy=b.y+b.h/2;
    for (let i=0;i<5;i++){ const a = b.vort.a + i/6*Math.PI*2, ox = cx+Math.cos(a)*b.vort.r, oy = cy+Math.sin(a)*b.vort.r;   // 5 quả trên 6 vị trí → chừa 1 khe
      if (Math.hypot(ox-px, oy-py) < 22) hurtPlayer(bossDmg(), ox); } }
  // chạm thân boss
  const br = {x:b.x+8, y:b.y+8, w:b.w-16, h:b.h-16};
  if (ov(p, br) && b.st!=='trans'){
    if (p.dashT>0 && !p.dashHit.has('boss')){ p.dashHit.add('boss'); dashImpact(b, true); }
    else if (p.dashT<=0 && b.st!=='stun') hurtPlayer(bossDmg(), b.x+b.w/2);
  }
}
function updateWave(dt){
  const w = wave; if (!w || w.done) return;
  updateSpawns(dt);
  const px = player.x+11;
  if (!w.active){
    if (px > w.trigger*T && px < (w.trigger+12)*T && player.ground){ w.active = true; w.idx = 0; spawnWave(); SFX.play('gate'); SFX.play('roar'); popups.push({x:px, y:player.y-30, text:'CỔNG ĐÓNG! Đợt 1/'+w.spawns.length, life:2, big:true}); }
    return;
  }
  if (!enemies.some(e=>e.wave && !e.dead) && !(w.pending && w.pending.length)){
    w.idx++;
    if (w.idx >= w.spawns.length){ w.active = false; w.done = true; SFX.play('gate'); SFX.play('exit'); popups.push({x:px, y:player.y-30, text:'Hết quái! Cổng mở.', life:2.4, big:true}); }
    else { spawnWave(); popups.push({x:px, y:player.y-30, text:'Đợt '+(w.idx+1)+'/'+w.spawns.length, life:2, big:true}); SFX.play('roar'); }
  }
}
// Quái theo đợt: mở cổng mực 1 giây trước khi xuất hiện, không bao giờ mọc ngay dưới chân Bấc
const SPAWN_DELAY = 1.0, SPAWN_SAFE = 4*T;
function spawnWave(){
  const w = wave, gates = (tiles.W||[]).map(t=>t.x), L = (Math.min(...gates)+1)*T, R = Math.max(...gates)*T, px = player.x+11;
  w.pending = [];
  for (const [c,tx,ty] of w.spawns[w.idx]){
    let x = tx*T + T/2;
    if (Math.abs(x-px) < SPAWN_SAFE){                     // quá gần → dời sang phía xa trong phòng
      const mirror = L + R - x;
      x = Math.abs(mirror-px) >= SPAWN_SAFE ? mirror : (px < (L+R)/2 ? R - 2*T : L + 2*T);
    }
    w.pending.push({c, tx:Math.floor(x/T), ty, t:SPAWN_DELAY + Math.random()*.3, fly: c==='3' || c==='6'});
  }
  SFX.play('portal');
}
function updateSpawns(dt){
  const w = wave; if (!w || !w.pending) return;
  for (const s of w.pending){
    s.t -= dt;
    const cx = s.tx*T + T/2, cy = s.fly ? s.ty*T + T/2 : (s.ty+1)*T;
    if (Math.random() < .5) parts.push({x:cx+(Math.random()-.5)*36, y:cy-(s.fly?0:2), vx:(Math.random()-.5)*30, vy:-60-Math.random()*80, a:-1.57, va:0, l:3+Math.random()*4, life:.4});
    if (s.t <= 0){
      spawnEnemy(s.c, s.tx, s.ty); const e = enemies[enemies.length-1]; e.wave = true; e.t = -.35; e.hurtT = .2;
      SFX.play('pop'); shakeT = Math.max(shakeT, .08);
      for (let i=0;i<14;i++){ const a=i/14*Math.PI*2; parts.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:Math.cos(a)*180,vy:Math.sin(a)*180-60,a,va:0,l:5,life:.5}); }
      s.done = true;
    }
  }
  w.pending = w.pending.filter(s=>!s.done);
}
function drawSpawns(){
  const w = wave; if (!w || !w.pending) return;
  ctx.save(); ctx.strokeStyle=INK; ctx.fillStyle=INK;
  for (const s of w.pending){
    const k = clamp(1 - s.t/SPAWN_DELAY, 0, 1), cx = s.tx*T + T/2;
    if (s.fly){   // cổng trên không: vòng xoáy co dần
      const cy = s.ty*T + T/2, r = 26 - k*12;
      ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(cx, cy, r+6, clock*4, clock*4+Math.PI*1.6); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(cx, cy, r*k, 0, Math.PI*2); ctx.fill();
    } else {      // vũng mực trên sàn loang dần, bóng quái hiện lờ mờ
      const fy = (s.ty+1)*T;
      ctx.beginPath(); ctx.ellipse(cx, fy-2, 8 + k*26, 2 + k*4, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = .15 + k*.35; ctx.setLineDash([3,3]); ctx.lineWidth = 1.5;
      ctx.strokeRect(cx-16, fy - 6 - k*24, 32, k*24); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // dấu cảnh báo + vòng đếm ngược
    const ty = (s.fly ? s.ty*T : (s.ty+1)*T - 40) - 14;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, ty, 9, -Math.PI/2, -Math.PI/2 + Math.PI*2*k); ctx.stroke();
    ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', cx, ty+4);
  }
  ctx.restore();
}
function updateCombat(dt){
  const p = player;
  updateWave(dt);
  p.invT -= dt; hurtFlash -= dt;
  // ngắm & ném: giữ F để nạp lực, thả để ném
  if (inp.throw && state==='play'){ p.charging = true; p.charge = Math.min(1, p.charge + dt/.8); }
  else if (p.charging){ p.charging = false; throwFlask(); p.charge = 0; }
  // lọ đang bay
  for (const f of flasks){
    f.vy += FLASK_G*dt; f.vx += windAt(f.x, f.y)*420*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += dt*12;
    if (f.y > RH || solid(Math.floor(f.x/T), Math.floor(f.y/T)) || 'xw'.includes(tileAt(f.x,f.y)) || hitsEnemy(f.x,f.y)){ f.dead = true; splash(f.x, f.y, f.kind); }
  }
  flasks = flasks.filter(f=>!f.dead);
  // quái
  ENEMY_LOOK = {x:p.x+11, y:p.y+17};
  for (const d of decals) d.life -= dt; decals = decals.filter(d=>d.life>0);
  for (const e of enemies){
    if (e.dead) continue;
    e.t += dt; e.hurtT -= dt; e.knock = (e.knock||0) - dt; updateEnemyAnim(e, dt);
    const ex = e.x+e.w/2, ey = e.y+e.h/2, dx = p.x+11-ex, dist = Math.hypot(dx, p.y+17-ey);
    if (e.type==='jelly'){ // sứa hydro: nổi nhờ lực đẩy Archimedes, trôi chậm về phía Bấc
      e.vx += (Math.sign(dx)*ENEMY.jelly.speed*(dist<320?1:0) - e.vx)*Math.min(1,dt*1.2);
      e.vy = Math.sin(e.t*1.6)*22 + (e.y > e.home.y ? -18 : 6);
      e.x += e.vx*dt; e.y += e.vy*dt; e.dir = Math.sign(e.vx)||1;
      for (const k of litLamps){ const [lx,ly] = k.split(',').map(Number); if (Math.hypot(lx*T+T/2-ex, ly*T-ey) < LIGHT_R*.75){ explodeJelly(e); break; } }
      if (e.dead) continue;
    } else if (e.type==='spitter'){ // tháp phun axit: bắn cung parabol về phía Bấc
      e.dir = Math.sign(dx)||1; e.vy = Math.min(FALL_MAX, e.vy + G*dt); entMove(e, 0, e.vy*dt);
      if (dist < 420 && e.t > 2.4){
        e.t = 0; const sx = ex, sy = e.y+4, t = .95, g = 900;
        blobs.push({x:sx, y:sy, vx:(p.x+11-sx)/t, vy:(p.y+17-sy-.5*g*t*t)/t, g, r:6, acid:true}); SFX.play('blob'); e.shot = 1;
      }
      e.tell = dist < 420 && e.t > 1.95;
    } else if (e.fly){ // bóng mực: bay lượn, đuổi theo, xuyên tường
      const sp = ENEMY.shade.speed * (dist < 300 ? 1 : .3);
      e.vx += (Math.sign(dx)*sp - e.vx)*Math.min(1,dt*2); e.vy = Math.sin(e.t*2.4)*40 + Math.sign(p.y+10-ey)*sp*.5*(dist<300?1:0);
      e.x += e.vx*dt; e.y += e.vy*dt; e.dir = Math.sign(e.vx)||1;
      // ánh sáng đèn dầu làm tan bóng mực
      for (const k of litLamps){ const [lx,ly] = k.split(',').map(Number); if (Math.hypot(lx*T+T/2-ex, ly*T-ey) < LIGHT_R){ e.burn = (e.burn||0) + dt; e.vx -= Math.sign(lx*T+T/2-ex)*300*dt; } }
      if (e.burn > .45){ killEnemy(e, 'ánh sáng xua tan bóng mực'); continue; }
    } else {
      e.vy = Math.min(FALL_MAX, e.vy + G*dt);
      if (e.knock <= 0){
        const D = ENEMY[e.type];
        if (e.type==='slime' && e.ground && dist < 180 && e.t > 1.1){ e.t = 0; e.dir = Math.sign(dx)||1; e.vy = -430; e.vx = e.dir*150; SFX.play('squish'); }
        else if ((e.type==='limestone'||e.type==='iron') && e.ground && dist < 210 && e.t > 3){ e.t = 0; e.dir = Math.sign(dx)||1; e.charging = 1; }
        else if (e.type==='slug' && e.ground && dist < 220){ e.dir = Math.sign(dx)||1; }
        e.charging = Math.max(0, (e.charging||0) - dt);
        if (e.ground && !(e.type==='slime' && e.vy<0)){
          const spd = e.charging>0 ? 120 : D.speed;
          // quay đầu khi gặp tường hoặc mép vực
          const ahead = e.dir>0 ? e.x+e.w+2 : e.x-2, below = Math.floor((e.y+e.h+4)/T);
          if (!solid(Math.floor(ahead/T), below) || solid(Math.floor(ahead/T), Math.floor((e.y+e.h/2)/T))) e.dir *= -1;
          e.vx = e.dir*spd;
        }
      } else e.vx *= Math.pow(.2, dt);
      entMove(e, e.vx*dt, e.vy*dt);
      // bị đẩy vào gai / axit / vực → chết (đúng chất vật lý)
      const tl = tileAt(ex, e.y+e.h-4);
      if (tl==='^' || (tl==='x' && e.type!=='slime' && e.type!=='spitter') || e.y > RH){ killEnemy(e, tl==='^' ? 'đẩy vào gai!' : tl==='x' ? 'rơi vào axit' : null); continue; }
    }
    // va chạm với Bấc: giẫm từ trên xuống, lướt, hoặc bị thương
    if (ov(p, e)){
      const fromAbove = p.vy > 60 && (p.y+p.h) - e.y < 16;
      if (fromAbove) stomp(e);
      else if (p.dashT>0){ if (!p.dashHit.has(e)){ p.dashHit.add(e); if (e.type==='jelly') popJelly(e); else if (e.type==='iron') dashImpact(e, false, true); else dashImpact(e, false); } }
      else if (p.invT<=0) hurtPlayer(1, ex);
    }
  }
  enemies = enemies.filter(e=>!e.dead || false);
  updateBoss(dt);
  // cục mực / giọt axit của boss
  for (const b of blobs){
    b.vy += b.g*dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (Math.hypot(b.x-(p.x+11), b.y-(p.y+17)) < b.r+12){ b.dead = true; hurtPlayer(1, b.x); }
    if (b.y > RH || solid(Math.floor(b.x/T), Math.floor(b.y/T))){ b.dead = true; for (let i=0;i<6;i++) parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*160,vy:-Math.random()*160,a:Math.random()*6,va:4,l:3,life:.4}); }
  }
  blobs = blobs.filter(b=>!b.dead);
  // vật rơi: mực (+mana), dầu đèn (+máu)
  for (const d of drops){
    if (!d.fixed){ d.vy = (d.vy||0) + 900*dt; d.y += d.vy*dt; const ty = Math.floor((d.y+8)/T); if (solid(Math.floor(d.x/T), ty)){ d.y = ty*T-8; d.vy = 0; } }
    if (Math.hypot(d.x-(p.x+11), d.y-(p.y+17)) < 24){
      d.dead = true;
      if (d.kind==='oil'){ p.hp = Math.min(HP_MAX, p.hp+1); popups.push({x:d.x, y:d.y-14, text:'+1 dầu đèn', life:1}); SFX.play('heal'); }
      else { mana = Math.min(MANA_MAX, mana+15); popups.push({x:d.x, y:d.y-14, text:'+15 mực', life:1}); SFX.play('orb'); }
    }
  }
  drops = drops.filter(d=>!d.dead);
  for (const r of ripples){ r.r += 180*dt; r.life -= dt; } ripples = ripples.filter(r=>r.life>0);
  for (const b of bubbles){ b.y += b.vy*dt; b.x += Math.sin(b.life*9)*.4; b.life -= dt; } bubbles = bubbles.filter(b=>b.life>0);
}

function devSpawnAt(col){
  // tìm chỗ đứng: ô trống có nền đặc ngay dưới, không phải gai/axit
  for (let dx=0; dx<12; dx++) for (const c of [col+dx, col-dx]){
    if (c<1 || c>=GW-1) continue;
    for (let ty=GH-2; ty>=1; ty--){
      const here = grid[ty][c], below = grid[ty+1][c];
      if (!solid(c,ty) && !solid(c,ty-1) && solid(c,ty+1) && !'^xw'.includes(here) && !'^xS'.includes(below)) return {x:c*T+9, y:(ty+1)*T-34};
    }
  }
  return {x:player.x, y:player.y};
}
function devGo(i, seg){
  closeDev(); story = null; reading = null; bossLoss = false;
  if (state!=='play'){ t0 = performance.now(); }
  lvl = i; load(i); state = 'play';
  if (typeof seg==='number' && seg >= 0){
    const sp = devSpawnAt(INTRO + seg*SEG + 2);
    player.x = sp.x; player.y = sp.y; cp = {x:sp.x, y:sp.y}; cpSeg = seg; curSeg = seg;
    if (crow){ crow.x = player.x-30; crow.y = player.y-50; crow.queue=[]; for (const t of (LEVELS[i].talks||[])) if (t[0] < INTRO + seg*SEG) crow.said.add(t[0]+','+t[1]); }
  }
  if ((seg==='fight' || seg==='cs') && boss){
    player.x = boss.arena.L + 3*T; player.y = boss.arena.floor - 34; cp = {x:player.x, y:player.y};
    if (seg==='fight'){ startBossCS(); skipBossCS(); }
  }
  player.invT = 1.5;   // vừa dịch chuyển: miễn sát thương một chút
  updateCam(0, true, true); noteSeg = -1;
}
function devKey(e){
  const m = devMenu, n = m.items.length;
  const step = d => { let k = m.sel; do { k = (k + d + n) % n; } while (m.items[k].h); m.sel = k; };
  if (e.code==='ArrowDown' || e.code==='KeyS'){ step(1); SFX.play('tick'); }
  else if (e.code==='ArrowUp' || e.code==='KeyW'){ step(-1); SFX.play('tick'); }
  else if (e.code==='Enter' || e.code==='Space') devActivate(m.items[m.sel]);   // không dùng E: E là phím tương tác trong game, bấm nhầm sẽ tải lại màn
  else if (e.code==='KeyE'){ closeDev(); }
  else if (e.code==='Escape') closeDev();
}
function devActivate(it){
  if (!it || it.h) return;
  if (it.tog){ dev[it.tog] = !dev[it.tog]; SFX.play('lever'); if (it.tog==='lite') resize(); if (it.tog==='tnt'){ if (dev.tnt){ reagent = 'tnt'; swapFx = null; } else if (reagent==='tnt') reagent = 'base'; } return; }
  SFX.play('start'); it.act();
}
function drawDevMenu(){

  const W = innerWidth, H = innerHeight, pw = Math.min(460, W-24), rowH = 22, ph = Math.min(H-40, 64 + m.items.length*rowH), px = (W-pw)/2, py = (H-ph)/2;
  ctx.save(); ctx.fillStyle='rgba(17,17,17,.55)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.fillRect(px,py,pw,ph); ctx.strokeRect(px,py,pw,ph);

  ctx.textAlign='right'; ctx.font=`400 10px ${FONT}`; ctx.fillText('↑↓ chọn · Enter vào · Esc đóng', px+pw-12, py+20);
  const visible = Math.floor((ph-44)/rowH);
  if (m.sel < m.scroll+1) m.scroll = Math.max(0, m.sel-1);
  if (m.sel > m.scroll+visible-2) m.scroll = Math.min(m.items.length-visible, m.sel-visible+2);
  m.scroll = Math.max(0, m.scroll); m.rows = [];
  ctx.save(); ctx.beginPath(); ctx.rect(px, py+34, pw, ph-38); ctx.clip();
  for (let k=0; k<visible && m.scroll+k<m.items.length; k++){
    const it = m.items[m.scroll+k], y = py+38+k*rowH; m.rows.push({y, idx:m.scroll+k});

    const sel = m.scroll+k===m.sel;
    if (sel){ ctx.fillStyle=INK; ctx.fillRect(px+6, y+1, pw-12, rowH-2); }
    ctx.fillStyle = sel ? PAPER : INK; ctx.font=`${it.lv?700:400} 12px ${FONT}`; ctx.textAlign='left';
    let lab = it.label; if (it.tog) lab = (dev[it.tog] ? '[x] ' : '[ ] ') + lab;
    if (it.lv && lvl===m.items.indexOf(it) && false) lab += ' ●';

}
function devClick(x, y){

// ===================================================================
//  CHƯƠNG — toàn bộ nội dung hiện tại là Chương 1 (5 phần = 5 phần tử trong LEVELS)
//  Thêm phần mới: thêm 1 phần tử vào LEVELS (map + hints/notes/talks/pages),
//  thêm thẻ vào STORY.chapters[i], tên đoạn vào SEG_NAMES[i] (menu dev tự cập nhật).
//  Sang chương mới: đổi CHAPTER, thay STORY.intro/finale, và thêm LEVELS của chương đó.
// ===================================================================
const CHAPTER = {no:1, title:'Ngọn đèn tắt', next:'Chương 2'};
const LAST_CH = {no:3, title:'Phòng Thí Nghiệm Số 0', next:'phần tiếp theo của Chương 3', partial:true};
// ===================================================================
//  QUÁI VẬT — ngoại hình & hoạt ảnh
//  Quy ước: axit = thân ĐEN bóng · bazơ = thân TRẮNG · đá vôi/sắt = vỏ có vân · bóng/khí = mờ ảo
// ===================================================================
let ENEMY_LOOK = {x:0, y:0};             // điểm mắt quái nhìn theo (Bấc, hoặc mục tiêu trong sổ tay)
let decals = [];                          // vết trên sàn: vũng axit xèo, vệt xà phòng
function lookDir(x, y, max){ const dx = ENEMY_LOOK.x - x, dy = ENEMY_LOOK.y - y, d = Math.hypot(dx,dy)||1; return {x:dx/d*max, y:dy/d*max}; }
function rimFill(fill){ ctx.fillStyle = fill; ctx.fill(); }
function rimPath(lw){ ctx.save(); ctx.strokeStyle = PAPER; ctx.lineWidth = lw||2.4; ctx.globalAlpha *= .9; ctx.stroke(); ctx.restore(); }

// ---------- 1. NHẦY AXIT: giọt axit đen bóng, sủi bọt, nhỏ giọt ----------
function drawSlime(e, hit){
  // Nhầy Axit: khối nguyên sinh chất ăn mòn — viền méo động, nhân-mắt bên trong, xương con mồi đang tan dở
  const ex = e.x+e.w/2, by = e.y+e.h, d = e.dir||1;
  let sx = 1, sy = 1;
  if (!e.ground){ sx = .82; sy = 1.25; }
  else if (e.crouch > 0){ sx = 1 + .3*e.crouch; sy = 1 - .32*e.crouch; }
  if (e.land > 0){ sx += .35*e.land; sy -= .28*e.land; }
  const W = 17*sx, H = 25*sy, B = hit ? PAPER : INK, F = hit ? INK : PAPER, t = e.t;
  const L = lookDir(ex, by-H*.5, 1);
  ctx.save(); ctx.translate(ex, by);
  if (e.ground){ ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, -.5, W*1.35, 2.2, 0, 0, Math.PI*2); ctx.fill(); }
  // viền: đường cong kín với nhiều thuỳ chuyển động lệch pha, thuỳ phía Bấc vươn ra (giả túc)
  const N = 22, pts = [];
  for (let i=0;i<N;i++){
    const a = Math.PI + i/(N-1)*Math.PI; // nửa trên từ trái qua phải
    let r = 1 + .07*Math.sin(a*3 + t*2.3) + .05*Math.sin(a*5 - t*3.1);
    const toward = Math.cos(a)*L.x; if (toward > 0) r += toward*.12*(1 + (e.crouch||0));
    pts.push([Math.cos(a)*W*r*1.1, Math.sin(a)*H*r]);
  }
  ctx.beginPath(); ctx.moveTo(-W*1.25, 0);
  ctx.lineTo(pts[0][0], pts[0][1]*.2);
  for (let i=1;i<N;i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i]; ctx.quadraticCurveTo(x0, y0, (x0+x1)/2, (y0+y1)/2); }
  ctx.lineTo(W*1.25, 0); ctx.closePath();
  const outline = new Path2D(); // lưu lại để clip
  if (hit){ ctx.fillStyle=B; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); } else { rimPath(2.6); ctx.fillStyle=B; ctx.fill(); }
  ctx.save(); ctx.clip();
  // lớp màng: vòng đồng tâm mờ theo hình dạng
  ctx.strokeStyle = F; ctx.lineWidth = .8; ctx.globalAlpha = .22;
  for (const k of [.78,.56]){ ctx.beginPath(); ctx.ellipse(0, -H*.08, W*1.1*k, H*k, 0, Math.PI, Math.PI*2); ctx.stroke(); }
  // xương con mồi tan dở (xương sườn + đốt sống), trôi chậm
  ctx.globalAlpha = .55; ctx.save(); ctx.translate(-W*.35 + Math.sin(t*.7)*1.5, -H*.28 + Math.cos(t*.9)*1.2); ctx.rotate(-.5 + Math.sin(t*.5)*.1);
  // sọ chuột nhỏ: hộp sọ + hốc mắt + hàm, mép đã bị ăn mòn
  ctx.fillStyle = F; ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 3.4, 0, 0, Math.PI*2); ctx.moveTo(2.5, 1); ctx.quadraticCurveTo(6.5, 1.5, 6.8, 3); ctx.lineTo(2, 3.2); ctx.fill();
  ctx.fillStyle = B; ctx.beginPath(); ctx.arc(1.6, -.2, 1.2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-2.6, -1.5, .8, 0, Math.PI*2); ctx.arc(-1.2, 2, .6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = F; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(-1, 3.6); ctx.quadraticCurveTo(2.5, 6, 6, 4.4); ctx.stroke();
  ctx.restore();
  // bọt khí nhỏ li ti bốc lên
  ctx.lineWidth = .8;
  for (let i=0;i<6;i++){ const ph = (t*.55 + i*.17)%1; ctx.globalAlpha = .7*(1-ph); ctx.beginPath(); ctx.arc(-W*.7 + i*W*.3 + Math.sin(t*2+i)*1.5, -1 - ph*H*.9, .6 + (i%3)*.35, 0, Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // nhân-mắt: màng trắng, đồng tử dọc dạng khe, co lại khi chuẩn bị nhảy
  const nx = W*.12 + L.x*3, ny = -H*.52 + L.y*2;
  ctx.fillStyle = F; ctx.beginPath(); ctx.ellipse(nx, ny, 4.6, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = B; const slit = 1.6 - (e.crouch||0)*1;
  ctx.beginPath(); ctx.ellipse(nx + L.x*1.4, ny + L.y, Math.max(.5, slit), 3.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = F; ctx.lineWidth = .7; ctx.globalAlpha = .4; ctx.beginPath(); ctx.arc(nx, ny, 6.8, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
  // vệt sáng ướt (ánh phản chiếu dài, mảnh)
  ctx.restore();
  ctx.strokeStyle = F; ctx.lineCap = 'round'; ctx.lineWidth = 1.6; ctx.globalAlpha = .85;
  ctx.beginPath(); ctx.ellipse(0, -H*.1, W*.85, H*.78, 0, Math.PI*1.18, Math.PI*1.36); ctx.stroke();
  ctx.lineWidth = 1.1; ctx.beginPath(); ctx.ellipse(0, -H*.1, W*.85, H*.78, 0, Math.PI*1.42, Math.PI*1.47); ctx.stroke();
  ctx.globalAlpha = 1;
  // dây nhầy + giọt rơi ở mép
  ctx.fillStyle = B; ctx.strokeStyle = B; ctx.lineWidth = 1.4;
  for (const [s2,k] of [[-1,0],[1,.55]]){ const ph = (t*.9 + k) % 1, x = s2*W*1.02, len = 2 + ph*6;
    ctx.beginPath(); ctx.moveTo(x, -H*.25); ctx.lineTo(x + s2*.6, -H*.25 + len); ctx.stroke();
    if (ph > .6){ ctx.beginPath(); ctx.ellipse(x + s2*.6, -H*.25 + len + 2 + (ph-.6)*12, 1.3, 1.9, 0, 0, Math.PI*2); ctx.fill(); } }
  ctx.restore();
}

// ---------- 2. GIÁP ĐÁ VÔI: bọ giáp mảnh CaCO₃, 6 chân, càng kẹp ----------
function drawLimestone(e, hit){
  const ex = e.x+e.w/2, by = e.y+e.h, d = e.dir||1, chg = e.charging>0;
  ctx.save(); ctx.translate(ex, by); ctx.scale(d,1);
  if (chg) ctx.rotate(.05);
  // 6 chân có khớp, dáng đi kiềng ba chân (3 chân sau mờ hơn)
  const ph = (e.walk||0)*.32;
  for (const back of [1,0]){
    ctx.strokeStyle = INK; ctx.globalAlpha = back ? .5 : 1; ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    for (let i=0;i<3;i++){ const hx = -12 + i*11, p = ph + i*2.1 + back*Math.PI, fx = hx + Math.sin(p)*5 - 2, lift = Math.max(0, Math.cos(p))*4;
      ctx.beginPath(); ctx.moveTo(hx, -8); ctx.lineTo(hx + (fx-hx)*.5 - 3, -14 - lift*.5); ctx.lineTo(fx, -lift); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // đầu + càng kẹp + râu
  const hy = chg ? -8 : -11, open = .25 + Math.max(0, Math.sin(e.t*(chg?14:3)))*.35;
  ctx.beginPath(); ctx.ellipse(19, hy, 6.5, 5.5, 0, 0, Math.PI*2); rimPath(2.4); ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (const s2 of [-1,1]){ ctx.beginPath(); ctx.moveTo(23, hy+s2*1.5); ctx.quadraticCurveTo(30, hy+s2*(3+open*5), 32, hy+s2*open*2); ctx.stroke(); }
  ctx.lineWidth = 1.2; for (const k of [0,1]){ const w = Math.sin(e.t*3+k)*3; ctx.beginPath(); ctx.moveTo(20, hy-4); ctx.quadraticCurveTo(25+k*3, hy-14, 31+k*4+w, hy-13+w*.5); ctx.stroke(); }
  const L = lookDir(ex + 21*d, by + hy, 1); ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(21 + L.x*d, hy-1 + L.y, 1.7, 0, Math.PI*2); ctx.fill();
  // thân dưới mềm
  ctx.beginPath(); ctx.ellipse(0, -11, 19, 9, 0, 0, Math.PI*2); rimPath(3); ctx.fillStyle = hit?PAPER:INK; ctx.fill();
  if (e.armor < 2){ ctx.strokeStyle = hit?INK:PAPER; ctx.lineWidth = 1; ctx.globalAlpha = .5 + .4*Math.sin(e.t*8);
    ctx.beginPath(); ctx.moveTo(-14,-12); ctx.quadraticCurveTo(-5,-19,4,-13); ctx.quadraticCurveTo(10,-8,16,-14); ctx.stroke(); ctx.globalAlpha = 1; }
  // mai đá vôi: một vòm liền, chia 4 đốt cong (kiểu rệp gỗ), vân rỗ; trúng axit → đốt giữa vỡ mất
  if (e.armor > 0){
    const R = 21, H = 19, cy = -9, F = hit ? INK : PAPER, K = hit ? PAPER : INK;
    const dome = ()=>{ ctx.beginPath(); ctx.moveTo(-R, cy); ctx.bezierCurveTo(-R, cy-H*1.3, R, cy-H*1.3, R, cy); ctx.closePath(); };
    dome(); ctx.fillStyle = F; ctx.fill();
    ctx.save(); dome(); ctx.clip();
    // đường ranh các đốt: cong theo vòm
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
    const xs = [-10.5, 0, 10.5];
    for (const x of xs){ ctx.beginPath(); ctx.moveTo(x*1.15, cy+1); ctx.quadraticCurveTo(x*.9, cy-H*.6, x*.55, cy-H*1.2); ctx.stroke(); }
    // vân rỗ + gờ ngang mỗi đốt
    ctx.fillStyle = K; const pits = [[-15,-4],[-13,-11],[-6,-6],[-4,-14],[4,-9],[6,-15],[13,-5],[15,-12],[-9,-17],[9,-3]];
    for (const [x,y] of pits){ ctx.beginPath(); ctx.arc(x, cy+y, (Math.abs(x*y)%3)*.35 + .7, 0, Math.PI*2); ctx.fill(); }
    ctx.lineWidth = 1; ctx.globalAlpha = .45; ctx.beginPath(); ctx.ellipse(0, cy+2, R*.82, H*.55, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke(); ctx.globalAlpha = 1;
    // bị axit: đốt 2 vỡ thành lỗ đen răng cưa + vết nứt lan
    if (e.armor === 1){
      ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(-9, cy+1);
      [[-8,-6],[-5,-4],[-3,-11],[1,-8],[3,-14],[6,-9],[9,-12],[11,1]].forEach(([x,y])=>ctx.lineTo(x, cy+y)); ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAPER; for (let i=0;i<3;i++){ const ph = (e.t*1.4 + i*.33)%1; ctx.globalAlpha = 1-ph; ctx.beginPath(); ctx.arc(-4+i*4, cy-6-ph*8, 1, 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = 1;
      ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(3,cy-14); ctx.lineTo(6,cy-19); ctx.lineTo(4,cy-23); ctx.moveTo(-8,cy-6); ctx.lineTo(-14,cy-9); ctx.lineTo(-15,cy-15); ctx.stroke();
    }
    ctx.restore();
    dome(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-R-2, cy); ctx.lineTo(R+2, cy); ctx.stroke();
    ctx.scale(d,1); ctx.fillStyle=INK; ctx.font=`700 8px ${FONT}`; ctx.textAlign='center'; ctx.globalAlpha=.6; ctx.fillText('CaCO₃', 0, -38);
  }
  ctx.restore();
}

// ---------- 3. BÓNG MỰC: hồn ma trùm mũ, đuôi xé tua, một mắt lớn ----------
function drawShade(e, hit){
  const ex = e.x+e.w/2, ey = e.y+e.h/2, burn = e.burn||0;
  ctx.save();
  ctx.globalAlpha = Math.max(.25, .96 - burn*1.3) * (.92 + Math.sin(e.t*23)*.06);
  ctx.translate(ex, ey);
  const back = -(Math.sign(e.vx)||e.dir||1), sway = Math.sin(e.t*3)*2;
  // tà áo rách: mép dưới răng cưa, kéo dài về phía sau theo hướng bay
  ctx.beginPath(); ctx.moveTo(0,-17 + sway*.3);
  ctx.quadraticCurveTo(13,-15,12,-1);
  const n = 6;
  for (let k=0;k<=n;k++){ const t = k/n, x = 12 - t*24 + back*t*t*10, y = 6 + (k%2 ? 10 + Math.sin(e.t*8+k)*3 : 2) + t*4*Math.abs(back); ctx.lineTo(x, y); }
  ctx.quadraticCurveTo(-13,-15,0,-17 + sway*.3); ctx.closePath();
  if (hit){ ctx.fillStyle=PAPER; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); } else { rimPath(2.6); ctx.fillStyle=INK; ctx.fill(); }
  // dải khói bay ngược phía sau
  ctx.strokeStyle = INK; ctx.lineCap='round';
  for (let r=0;r<2;r++){ ctx.globalAlpha *= .8; ctx.lineWidth = 3 - r; ctx.beginPath();
    for (let k=0;k<=6;k++){ const t=k/6, x = back*(10 + t*18), y = 8 + r*5 + Math.sin(e.t*6 - t*5 + r*2)*3*t; k? ctx.lineTo(x,y) : ctx.moveTo(x,y); } ctx.stroke(); }
  ctx.globalAlpha = Math.max(.25, .96 - burn*1.3);
  // mắt lớn + vòng sáng, mí khép khi bị đèn chiếu
  const L = lookDir(ex, ey, 1), squint = Math.min(1, burn*2.5);
  ctx.fillStyle = hit?INK:PAPER; ctx.beginPath(); ctx.ellipse(L.x*1.5, -5 + L.y, 6.2, 6.2*(1-squint*.75), 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = hit?PAPER:INK; ctx.beginPath(); ctx.arc(L.x*3.6, -5 + L.y*2.4, 2.6*(1-squint*.5), 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = hit?INK:PAPER; ctx.lineWidth = .8; ctx.globalAlpha *= .6; ctx.beginPath(); ctx.arc(L.x*1.5, -5 + L.y, 8.5, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = Math.max(.25, .96 - burn*1.3);
  // vuốt dài thò ra về phía Bấc khi ở gần
  const near = Math.hypot(ENEMY_LOOK.x-ex, ENEMY_LOOK.y-ey) < 150;
  if (near){ const a = Math.atan2(L.y, L.x), reach = 16 + Math.sin(e.t*10)*2, ax = Math.cos(a)*reach, ay = Math.sin(a)*reach + 2;
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*8, 2); ctx.quadraticCurveTo(Math.cos(a)*12, -4, ax, ay); ctx.stroke();
    ctx.lineWidth = 1.4; for (const f of [-.6,0,.6]){ ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(ax+Math.cos(a+f)*4, ay+Math.sin(a+f)*4-1, ax+Math.cos(a+f*1.3)*7, ay+Math.sin(a+f*1.3)*7); ctx.stroke(); } }
  // bị đốt: mép tan thành tro bay lên
  if (burn > 0){ ctx.fillStyle = INK; for (let i=0;i<8;i++){ const a = i/8*Math.PI*2 + e.t*2, rr = 12 + ((e.t*30 + i*7)%10); ctx.fillRect(Math.cos(a)*rr, Math.sin(a)*rr - burn*10, 1.6, 1.6); } }
  ctx.restore();
}

// ---------- 4. SÊN KIỀM: thân trắng trơn như xà phòng, tinh thể NaOH trên lưng ----------
function drawSlug(e, hit){
  const ex = e.x+e.w/2, by = e.y+e.h, d = e.dir||1, wv = (e.walk||0)*.5;
  ctx.save(); ctx.translate(ex, by); ctx.scale(d,1);
  const stretch = 1 + Math.sin(wv)*.06;
  // thân + chân bụng gợn sóng nhu động
  ctx.beginPath(); ctx.moveTo(-19*stretch, 0);
  for (let i=0;i<=8;i++){ const x = -19*stretch + i*(38*stretch)/8; ctx.lineTo(x, Math.sin(i*1.4 - wv*3)*.9); }
  ctx.quadraticCurveTo(20, -6, 14, -12); ctx.quadraticCurveTo(4, -19, -8, -15); ctx.quadraticCurveTo(-19*stretch, -11, -19*stretch, 0); ctx.closePath();
  ctx.fillStyle = hit ? INK : PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  // vệt bóng trơn
  ctx.strokeStyle = hit ? PAPER : INK; ctx.lineWidth = 1; ctx.globalAlpha = .55;
  ctx.beginPath(); ctx.arc(-6, -6, 9, Math.PI*1.15, Math.PI*1.45); ctx.stroke(); ctx.globalAlpha = 1;
  // yên lưng: tinh thể NaOH lục giác
  for (let i=0;i<3;i++){ const cx = -8 + i*6, cy = -15 + Math.abs(i-1)*1.5, r = 3.2 - Math.abs(i-1)*.6;
    ctx.beginPath(); for (let k=0;k<6;k++){ const a=k/6*Math.PI*2+.5; ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); } ctx.closePath();
    ctx.fillStyle = hit?PAPER:INK; ctx.fill(); }
  // râu mắt + râu cảm giác
  const L = lookDir(ex + 12*d, by-20, 1);
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.lineCap='round';
  for (const [bx, len, ph] of [[9,11,0],[13,10,1.3]]){
    const tx = bx + 3 + Math.sin(e.t*3+ph)*2, ty = -12 - len + Math.cos(e.t*2.4+ph)*1.5;
    ctx.beginPath(); ctx.moveTo(bx, -12); ctx.quadraticCurveTo(bx+1, -12-len*.5, tx, ty); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(tx, ty, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(tx + L.x*d*.8, ty + L.y*.8, .8, 0, Math.PI*2); ctx.fill();
  }
  ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(16, -5); ctx.quadraticCurveTo(21, -6, 22, -2 + Math.sin(e.t*4)); ctx.stroke();
  ctx.scale(d,1); ctx.fillStyle=INK; ctx.font=`700 8px ${FONT}`; ctx.textAlign='center'; ctx.globalAlpha=.6; ctx.fillText('pH 12', 0, -28);
  ctx.restore();
}

// ---------- 5. THÁP PHUN AXIT: cây nắp ấm đen, túi axit phập phồng, miệng ngắm theo Bấc ----------
function drawSpitter(e, hit){
  const ex = e.x+e.w/2, by = e.y+e.h, tellK = e.tell ? .5 + .5*Math.sin(e.t*30) : 0, shot = Math.max(0, e.shot||0);
  const F = hit ? INK : PAPER, K = hit ? PAPER : INK;
  ctx.save(); ctx.translate(ex, by);
  // rễ + 2 lá gốc
  ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.lineCap='round';
  for (const [a,b] of [[-12,-4],[-6,-1],[6,1],[12,4]]){ ctx.beginPath(); ctx.moveTo(a*.3, -4); ctx.quadraticCurveTo(a*.8, 0, a+b, 1); ctx.stroke(); }
  for (const s2 of [-1,1]){ ctx.beginPath(); ctx.moveTo(s2*4, -3); ctx.quadraticCurveTo(s2*18, -8, s2*22, -18 + Math.sin(e.t*2+s2)*1.5); ctx.quadraticCurveTo(s2*12, -10, s2*4, -3); ctx.fillStyle = INK; ctx.fill(); }
  // bình nắp ấm: nghiêng nhẹ về phía Bấc, phồng khi sắp bắn, giật lùi khi bắn
  const L = ENEMY_LOOK.x - ex, tilt = Math.max(-.32, Math.min(.32, L/400)) - Math.sign(L||1)*shot*.15;
  const sw = 1 + (e.tell ? .1 : 0) + Math.sin(e.t*2)*.025 - shot*.15;
  ctx.save(); ctx.translate(0, -3); ctx.rotate(tilt); ctx.scale(sw, 1/sw*.1+.9*sw);
  const body = ()=>{ ctx.beginPath(); ctx.moveTo(-5, 0);
    ctx.bezierCurveTo(-17, -2, -17, -20, -9, -28); ctx.quadraticCurveTo(-6, -33, -9, -38);
    ctx.lineTo(9, -38); ctx.quadraticCurveTo(6, -33, 9, -28); ctx.bezierCurveTo(17, -20, 17, -2, 5, 0); ctx.closePath(); };
  body(); if (hit){ ctx.fillStyle = PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke(); } else { rimPath(3); ctx.fillStyle = INK; ctx.fill(); }
  // gân dọc + đốm
  ctx.save(); body(); ctx.clip();
  ctx.strokeStyle = F; ctx.lineWidth = 1; ctx.globalAlpha = .5;
  for (const x of [-10,10]){ ctx.beginPath(); ctx.moveTo(x*.4, -1); ctx.quadraticCurveTo(x*1.25, -16, x*.75, -30); ctx.stroke(); }
  ctx.fillStyle = F; for (const [x,y] of [[-11,-10],[11,-14],[-9,-24],[10,-6]]){ ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // ô kính: mực axit sóng sánh, dâng lên khi sắp bắn
  ctx.beginPath(); ctx.ellipse(0, -15, 6.5, 9, 0, 0, Math.PI*2); ctx.fillStyle = F; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = K; const lv = -12 + Math.sin(e.t*3)*1.2 - (e.tell ? 5 : 0) + shot*6;
  ctx.beginPath(); ctx.moveTo(-8, -4); for (let x=-8;x<=8;x+=2) ctx.lineTo(x, lv + Math.sin(x*.8 + e.t*6)*.9); ctx.lineTo(8, -4); ctx.fill();
  ctx.fillStyle = F; for (let i=0;i<3;i++){ const ph = (e.t*1.2 + i*.33)%1; ctx.beginPath(); ctx.arc(-3+i*3, -6 - ph*6, .9, 0, Math.PI*2); ctx.fill(); }
  ctx.restore(); ctx.restore();
  // miệng loe (vành răng) + nắp bật mở khi sắp bắn
  ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, -38, 12, 3.6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = F; ctx.beginPath(); ctx.ellipse(0, -38.4, 8.5, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = INK; for (let k=-3;k<=3;k++){ ctx.beginPath(); ctx.moveTo(k*2.6-1, -37); ctx.lineTo(k*2.6, -40); ctx.lineTo(k*2.6+1, -37); ctx.fill(); }
  const lid = .25 + tellK*.5 + shot*.9;
  ctx.save(); ctx.translate(-10, -40); ctx.rotate(-lid);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(8, -10, 22, -3); ctx.quadraticCurveTo(12, 2, 0, 0); if (!hit) rimPath(2.4); ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = PAPER; ctx.lineWidth = .9; ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(3,-1); ctx.quadraticCurveTo(10,-6,19,-3); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
  // giọt axit trào lên khi sắp bắn
  if (e.tell){ ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, -44 - tellK*3, 2.5 + tellK*1.5, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, -44, 7 + tellK*4, 0, Math.PI*2); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle=INK; ctx.font=`700 8px ${FONT}`; ctx.textAlign='center'; ctx.globalAlpha=.6; ctx.fillText('HCl', 0, -58);
  ctx.restore();
}

// ---------- 6. SỨA HYDRO: chuông trong suốt co bóp, bọt H₂ bên trong, xúc tu chuỗi hạt ----------
function drawJelly(e, hit){
  const ex = e.x+e.w/2, ey = e.y+e.h/2;
  let near = false; for (const k of litLamps){ const [lx,ly] = k.split(',').map(Number); if (Math.hypot(lx*T+T/2-ex, ly*T-ey) < LIGHT_R) near = true; }
  const rate = near ? 14 : 3, c = Math.sin(e.t*rate);
  const bw = 15*(1 + .12*c + (near?.12:0)), bh = 13*(1 - .1*c);
  ctx.save(); ctx.translate(ex, ey);
  // 5 xúc tu chuỗi hạt toả đều, đung đưa lệch pha (không bắt chéo)
  ctx.strokeStyle = INK; ctx.lineCap='round'; ctx.lineWidth = 1.1;
  for (let i=0;i<5;i++){
    const x0 = -bw*.75 + i*(bw*1.5/4), spread = (i-2)*1.6; ctx.beginPath(); ctx.moveTo(x0, 4);
    const pts = []; for (let k=1;k<=7;k++){ const t=k/7, x = x0 + spread*t*4 + Math.sin(e.t*2.2 - t*3.5 + i*.7)*2.5*t, y = 4 + t*24; pts.push([x,y]); ctx.lineTo(x,y); }
    ctx.stroke(); ctx.fillStyle = INK; pts.forEach(([x,y],k)=>{ if (k%2){ ctx.beginPath(); ctx.arc(x, y, 1.15, 0, Math.PI*2); ctx.fill(); } });
  }
  // 2 tay miệng xếp nếp ở giữa
  ctx.lineWidth = 2.6; for (const s2 of [-1,1]){ ctx.beginPath(); ctx.moveTo(s2*2.5, 4); for (let k=1;k<=4;k++) ctx.lineTo(s2*2.5 + Math.sin(e.t*3+k+s2)*1.8 + (k%2?s2*2:0), 4 + k*3.2); ctx.stroke(); }
  // chuông trong suốt, mép lượn sóng
  ctx.beginPath(); ctx.moveTo(-bw, 3);
  ctx.bezierCurveTo(-bw, -bh*1.4, bw, -bh*1.4, bw, 3);
  for (let k=0;k<=8;k++){ const x = bw - k*(2*bw/8); ctx.lineTo(x, 3 + (k%2 ? 2.5 : 0)); }
  ctx.closePath(); ctx.fillStyle = hit?INK:PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  // vòm trong nét đứt + 2 bọt khí nhỏ hai bên + nhãn H₂ ở giữa
  ctx.setLineDash([2,3]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-bw*.62, 2); ctx.bezierCurveTo(-bw*.62, -bh*.95, bw*.62, -bh*.95, bw*.62, 2); ctx.stroke(); ctx.setLineDash([]);
  for (const [x,k] of [[-bw*.45,0],[bw*.45,.5]]){ const ph = (e.t*.6 + k) % 1; ctx.globalAlpha = 1 - ph*.6; ctx.beginPath(); ctx.arc(x, -1 - ph*bh*.55, 1.6, 0, Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.fillStyle = hit?PAPER:INK; ctx.font = `700 8px ${FONT}`; ctx.textAlign='center'; ctx.fillText('H₂', 0, -bh*.32);
  if (near){ ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.globalAlpha = .5+.5*Math.sin(clock*40);
    for (let i=0;i<6;i++){ const a = i/6*Math.PI*2 + clock*5; line(Math.cos(a)*(bw+3), -4+Math.sin(a)*(bh+3), Math.cos(a)*(bw+9), -4+Math.sin(a)*(bh+9)); } }
  ctx.restore();
}

// ---------- 7. RÙA SẮT: mai thép ghép tấm lục giác, đinh tán, khe mắt phát sáng ----------
function drawIron(e, hit){
  const ex = e.x+e.w/2, by = e.y+e.h, d = e.dir||1, chg = e.charging>0, ph = (e.walk||0)*.18;
  ctx.save(); ctx.translate(ex, by); ctx.scale(d,1);
  // 4 chân trụ bọc giáp, bước nặng
  for (let i=0;i<4;i++){ const lx = -15 + i*10, lift = Math.max(0, Math.sin(ph + i*Math.PI/2))*3, back = i%2;
    ctx.fillStyle = INK; ctx.globalAlpha = back ? .7 : 1; ctx.fillRect(lx-3.5, -9 - lift, 7, 9);
    ctx.fillStyle = PAPER; ctx.fillRect(lx-3.5, -3 - lift, 7, 1.2); ctx.fillRect(lx-2, -lift - 1, 1.2, 1.2); ctx.fillRect(lx+1, -lift - 1, 1.2, 1.2); }
  ctx.globalAlpha = 1;
  // đầu đội mũ sắt, khe mắt sáng nhìn theo Bấc
  const hy = chg ? -10 : -13, nod = Math.sin(e.t*2)*.6;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(19, hy-7+nod); ctx.lineTo(28, hy-5+nod); ctx.lineTo(29, hy+4+nod); ctx.lineTo(19, hy+5+nod); ctx.closePath(); rimPath(2.4); ctx.fill();
  const L = lookDir(ex+24*d, by+hy, 1); ctx.fillStyle = PAPER; ctx.fillRect(21 + L.x*d, hy-2+nod+L.y*.6, 6, 1.6);
  ctx.strokeStyle = PAPER; ctx.lineWidth = 1; line(20, hy+2.5+nod, 28, hy+2.5+nod);
  // mai: vòm + viền tấm chữ nhật + lưới lục giác trắng mảnh + đinh tán
  ctx.beginPath(); ctx.moveTo(-22,-8); ctx.quadraticCurveTo(-22,-34,0,-34); ctx.quadraticCurveTo(22,-34,22,-8); ctx.closePath();
  if (hit){ rimFill(PAPER); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); } else { rimPath(3); rimFill(INK); }
  ctx.save(); ctx.clip(); ctx.strokeStyle = hit?INK:PAPER; ctx.lineWidth = .9; ctx.globalAlpha = .55;
  for (let r=0;r<3;r++) for (let q=-3;q<=3;q++){ const hx = q*9 + (r%2)*4.5, hy2 = -30 + r*8; ctx.beginPath(); for (let k=0;k<6;k++){ const a=k/6*Math.PI*2; ctx.lineTo(hx+Math.cos(a)*4.4, hy2+Math.sin(a)*4.4); } ctx.closePath(); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = hit?INK:PAPER; for (let i=0;i<7;i++){ const a = Math.PI + (i+.5)/7*Math.PI; ctx.beginPath(); ctx.arc(Math.cos(a)*18, -10 + Math.sin(a)*20, 1.1, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = INK; ctx.fillRect(-23, -10, 46, 4); ctx.strokeStyle = PAPER; ctx.lineWidth = 1; for (let i=-20;i<=20;i+=8) line(i, -10, i, -6);
  // ống xả trên mai phụt hơi khi lao tới
  ctx.fillStyle = INK; ctx.fillRect(-6, -38, 4, 5); ctx.fillRect(3, -37, 4, 4);
  if (chg){ ctx.strokeStyle = INK; ctx.lineWidth = 1.2; for (let i=0;i<3;i++){ const k = ((e.t*3 + i/3) % 1); ctx.globalAlpha = 1-k; ctx.beginPath(); ctx.arc(-4 - k*10, -42 - k*12, 2 + k*4, 0, Math.PI*2); ctx.stroke(); } ctx.globalAlpha = 1; }
  // vết nứt khi đã bị giẫm vỡ
  if (e.hp < ENEMY.iron.hp){ ctx.strokeStyle = PAPER; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-3,-33); ctx.lineTo(1,-25); ctx.lineTo(-3,-19); ctx.lineTo(2,-12); ctx.stroke();
    if (Math.sin(e.t*9) > .9){ ctx.fillStyle = INK; for (let i=0;i<3;i++) ctx.fillRect(-1 + (Math.random()-.5)*10, -28 + (Math.random()-.5)*8, 1.5, 1.5); } }
  ctx.scale(d,1); ctx.fillStyle=INK; ctx.font=`700 9px ${FONT}`; ctx.textAlign='center'; ctx.globalAlpha=.7; ctx.fillText('Fe', 0, -46);
  ctx.restore();
}
const ENEMY_DRAW = {slime:drawSlime, limestone:drawLimestone, shade:drawShade, slug:drawSlug, spitter:drawSpitter, jelly:drawJelly, iron:drawIron};
function drawEnemy(e){
  const hit = e.hurtT>0 && Math.floor(clock*30)%2===0;
  ctx.save(); if (e.hurtT>0) ctx.translate((Math.random()-.5)*3, 0);
  ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.lineJoin='round';
  (ENEMY_DRAW[e.type] || drawSlime)(e, hit);
  ctx.restore();
}
function drawDecals(){
  for (const d of decals){
    const a = Math.min(1, d.life);
    ctx.save(); ctx.globalAlpha = a*.7;
    if (d.type==='acid'){ ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(d.x, d.y-1, d.r, 1.6, 0, 0, Math.PI*2); ctx.fill();
      if (Math.sin(clock*12 + d.x) > .7){ ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(d.x+(d.x%5)-2, d.y-4, 1.2, 0, Math.PI*2); ctx.stroke(); } }
    else if (d.type==='soap'){ ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(d.x, d.y-2.5, d.r, 0, Math.PI*2); ctx.stroke(); }
    else if (d.type==='dust'){ ctx.fillStyle=INK; ctx.globalAlpha = a*.25; ctx.beginPath(); ctx.ellipse(d.x, d.y-2, d.r*(2-a), 2, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}
function updateEnemyAnim(e, dt){
  e.land = Math.max(0, (e.land||0) - dt*4);
  if (!e.fly){ if (e.ground && e.wasG === false) e.land = 1; e.wasG = e.ground; }
  e.walk = (e.walk||0) + Math.abs(e.vx||0)*dt;
  e.shot = Math.max(0, (e.shot||0) - dt*3);
  const ex = e.x+e.w/2, fy = e.y+e.h;
  e.crouch = 0;
  if (e.type==='slime' && e.ground){ const dist = Math.hypot(ENEMY_LOOK.x-ex, ENEMY_LOOK.y-(e.y+e.h/2)); if (dist < 180 && e.t > .8) e.crouch = Math.min(1, (e.t-.8)/.3); }
  e.dropT = (e.dropT||0) - dt;
  if (e.dropT <= 0 && e.ground){
    if (e.type==='slime'){ decals.push({x:ex+(Math.random()-.5)*14, y:fy, r:2.5+Math.random()*2, life:2.2, type:'acid'}); e.dropT = .5; }
    else if (e.type==='slug' && Math.abs(e.vx)>5){ decals.push({x:ex - (e.dir||1)*14, y:fy, r:1.5+Math.random()*2, life:2.5, type:'soap'}); e.dropT = .14; }
    else if ((e.type==='iron' || e.type==='limestone') && e.charging>0){ decals.push({x:ex - (e.dir||1)*18, y:fy, r:6, life:.6, type:'dust'}); e.dropT = .12; }
  }
}

function openBestiary(){
  closeDev();

function updateBestiary(dt){
  const B = bestiary; B.t += dt;
  B.list.forEach((it,i)=>{ const e = it.e; e.t += dt; e.vx = 40*Math.sin(B.t*.7 + i); e.dir = e.vx>=0 ? 1 : -1; e.walk += Math.abs(e.vx)*dt;
    const ph = (B.t + i*1.3) % 6;
    e.charging = (e.type==='limestone'||e.type==='iron') && ph > 3 && ph < 4 ? 1 : 0;
    e.tell = e.type==='spitter' && ph > 2 && ph < 2.5; if (e.type==='spitter' && ph >= 2.5 && ph < 2.55) e.shot = 1;
    e.shot = Math.max(0, (e.shot||0) - dt*3);
    e.crouch = e.type==='slime' && ph > 4.5 && ph < 5 ? (ph-4.5)/.5 : 0; e.ground = e.fly ? false : !(e.type==='slime' && ph >= 5 && ph < 5.6);
    e.land = e.type==='slime' && ph >= 5.6 && ph < 5.9 ? 1-(ph-5.6)/.3 : 0;
    e.hurtT = ph > 1 && ph < 1.25 ? .1 : 0;
    if (e.type==='iron') e.hp = ph > 4.6 ? 1 : 2;
    if (e.type==='limestone') e.armor = ph < 2 ? 2 : ph < 4 ? 1 : 0;
    e.burn = e.type==='shade' && ph > 5.2 ? (ph-5.2) : 0; });
}
function drawBestiary(){
  const B = bestiary; if (!B) return;
  const W = innerWidth, H = innerHeight;
  ctx.save(); ctx.fillStyle = WALL; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = INK; ctx.font = `400 ${Math.min(34, W/18)}px ${HAND}`; ctx.textAlign='center'; ctx.fillText('Sổ tay quái vật · Thế giới Sa Ngã', W/2, 44);
  ctx.font = `400 11px ${FONT}`; ctx.globalAlpha=.6; ctx.fillText('Esc / Enter / chạm để đóng', W/2, 64); ctx.globalAlpha=1;
  const cols = W > 820 ? 4 : W > 520 ? 3 : 2, gap = 12, cw = Math.min(220, (W - 32 - gap*(cols-1))/cols), ch = 168;
  const rows = Math.ceil(B.list.length/cols), x0 = (W - (cols*cw + (cols-1)*gap))/2, y0 = Math.max(80, (H - (rows*ch + (rows-1)*gap))/2 + 20);
  B.list.forEach((it, i)=>{
    const cx = x0 + (i%cols)*(cw+gap), cy = y0 + Math.floor(i/cols)*(ch+gap);
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillRect(cx, cy, cw, ch); ctx.strokeRect(cx, cy, cw, ch);
    ctx.lineWidth = 1; ctx.globalAlpha=.25; line(cx+12, cy+104, cx+cw-12, cy+104); ctx.globalAlpha=1;
    const e = it.e, k = 1.7, bx = cx + cw/2, by = cy + 100;
    ENEMY_LOOK = {x: Math.sin(B.t*.9 + i)*50, y: -30 + Math.cos(B.t*.7)*20};
    ctx.save(); ctx.beginPath(); ctx.rect(cx+2, cy+2, cw-4, 102); ctx.clip();
    ctx.translate(bx, by); ctx.scale(k, k);
    e.x = -e.w/2; e.y = e.fly ? -e.h - 18 + Math.sin(B.t*2+i)*3 : -e.h;
    if (!e.fly){ ctx.globalAlpha=.2; ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0, -1, e.w*.65, 3, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    drawEnemy(e);
    ctx.restore();
    ctx.fillStyle = INK; ctx.textAlign='left';
    ctx.font = `400 20px ${HAND}`; ctx.fillText(it.name, cx+12, cy+126);
    ctx.font = `400 10px ${FONT}`; ctx.globalAlpha=.75; ctx.fillText(it.sci, cx+12, cy+142, cw-20); ctx.globalAlpha=1;
    ctx.font = `700 10px ${FONT}`; ctx.fillText('↯ ' + it.weak, cx+12, cy+158, cw-20);
  });

}

  const mx=(cxs/n+.5)*T, my=(cys/n)*T;
  popups.push({x:mx, y:my-20, text:'HCl + NaOH → NaCl + H₂O', life:3.5, big:true});
  for (let i=0;i<40;i++) parts.push({x:mx+(Math.random()-.5)*n*8,y:my,vx:(Math.random()-.5)*200,vy:-Math.random()*380,a:Math.random()*6,va:(Math.random()-.5)*10,l:3+Math.random()*4,life:.9});
}
function computeSteam(){
  steamCols = [];
  for (const t of tiles.h||[]){
    const above = grid[t.y-1] && grid[t.y-1][t.x];
    if (above!=='w' && above!=='x') continue;
    let top = t.y-1; while (top>0 && !solid(t.x, top-1)) top--;
    steamCols.push({x:t.x*T, top:top*T, bottom:t.y*T, acid: above==='x'});
  }
}

const BTN = () => [

function syncTouch(){ inp.left=inp.right=false; inp.throw=false; inp.down=false; inp.act=false; let j=false; for (const id of ptrs.values()){ if(id==='left')inp.left=true; if(id==='right')inp.right=true; if(id==='down')inp.down=true; if(id==='act')inp.act=true; if(id==='jump')j=true; if(id==='throw')inp.throw=true; } inp.jump=j; }

function updateMirrorHold(dt){
  const p = player; mirrorNear = null;
  if (!tiles.r && !tiles.R) { p.aiming = false; return; }
  const cx = Math.floor((p.x+11)/T), cy = Math.floor((p.y+17)/T);
  for (let dy=-1; dy<=1 && !mirrorNear; dy++) for (let dx=-1; dx<=1 && !mirrorNear; dx++){ const c = (grid[cy+dy]||[])[cx+dx]; if (c==='r'||c==='R') mirrorNear = (cx+dx)+','+(cy+dy); }
  p.aiming = !!(mirrorNear && inp.act && p.ground);
  if (p.aiming){
    const d = inp.left ? -1 : 1, k = mirrorNear; mirrorAng[k] += d*MIRROR_SPEED*dt;
    mirrorTick += Math.abs(MIRROR_SPEED*dt); if (mirrorTick > .087){ mirrorTick = 0; SFX.play('tick'); }
    p.actT = .15;
  }
}
function updatePlayer(dt){
  const p = player;
  updateMirrorHold(dt);
  if (leverAct){ p.vx = 0; jumpBuf = 0; dashBuf = 0; p.vy = Math.min(p.vy + G*dt, FALL_MAX); moveY(p, p.vy*dt); heroAnim(p, dt); return; }
  p.flingT = Math.max(0, (p.flingT||0) - dt);
  if (p.rope){ if (updateRopePlayer(p, dt)) return; }
  else if (!p.ground && !p.crouch) tryGrabRope(p);
  const dir = p.aiming ? 0 : (inp.right?1:0)-(inp.left?1:0);
  p.lock-=dt; p.dashCd-=dt; jumpBuf-=dt; dashBuf-=dt; p.dropT = (p.dropT||0) - dt;
  if (inp.down && p.ground && onShelf(p)){ p.dropT = .22; p.y += 2; p.ground = false; p.coy = 0; }
  // Cúi xuống (giữ ↓/S): thân thấp còn 22px, đi chậm; đứng dậy chỉ khi trên đầu còn chỗ
  { const want = inp.down && p.ground && p.dashT<=0 && !p.inWater && !onShelf(p);
    if (want && !p.crouch){ p.crouch = true; p.y += CROUCH_DY; p.h = 34 - CROUCH_DY; p.sx = 1.14; p.sy = .86; dust(p.x+11, p.y+p.h, 3); SFX.play('crouch'); }
    else if (!want && p.crouch){ const r = {x:p.x+1, y:p.y-CROUCH_DY, w:p.w-2, h:CROUCH_DY}; if (!solidsFor(r,false).some(o=>ov(r,o))){ p.crouch = false; p.y -= CROUCH_DY; p.h = 34; p.sx = .92; p.sy = 1.1; } }
    if (p.crouch && jumpBuf > 0 && !inp.down){ /* muốn nhảy nhưng còn kẹt dưới trần */ jumpBuf = 0; } }
  if (dir && p.dashT<=0 && p.lock<=0) p.face = dir;

  const wl = touchWall(p,-1), wr = touchWall(p,1);
  const inWater = tileAt(p.x+11, p.y+20)==='w';
  const inSteam = (heaterOn && steamCols.some(c=>!c.acid && p.x+11>c.x && p.x+11<c.x+T && p.y+p.h>c.top && p.y+10<c.bottom)) || tileAt(p.x+11, p.y+p.h-4)==='|' || tileAt(p.x+11, p.y+8)==='|';
  p.inWater = inWater;
  if (inWater){ p.canDash = true; }

  // Lướt
  if (dashBuf>0 && p.dashT<=0 && p.dashCd<=0 && !p.canDash && mana < MANA_DASH){ dashBuf=0; manaFlash=.5; SFX.play('denied'); }
  if (dashBuf>0 && (p.canDash || mana>=MANA_DASH) && p.dashT<=0 && p.dashCd<=0){
    p.inkDash = !p.canDash; SFX.play(p.inkDash ? 'inkdash' : 'dash');
    if (p.inkDash){ mana -= MANA_DASH; for (let i=0;i<10;i++) parts.push({x:p.x+11,y:p.y+17,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,a:Math.random()*6,va:0,l:3,life:.5}); }
    dashBuf=0; p.canDash=false; p.dashT=DASH_TIME; p.dashCd=DASH_CD; p.dashHit = new Set();
    p.dashDir = p.wall ? -p.wall : (dir || p.face);
    p.face = p.dashDir; p.vy = 0; p.wall = 0; p.lock = 0;
    p.sx = 1.35; p.sy = .75;
    dust(p.x+11, p.y+20, 6, -p.dashDir);
  }

  // Nhảy: đất → tường → nhảy thêm (hạt sáng)
  if (jumpBuf>0){
    if (inWater && p.coy<=0){                         // bơi: quạt nước đi lên
      p.vy = -SWIM_STROKE; jumpBuf=0; p.sx=.85; p.sy=1.15; SFX.play('stroke');
      for (let i=0;i<5;i++) parts.push({x:p.x+11+(Math.random()-.5)*14,y:p.y+p.h,vx:(Math.random()-.5)*60,vy:60+Math.random()*60,a:1.57,va:0,l:3,life:.4});
    } else if (p.coy>0){
      p.vy=-JUMP; p.coy=0; jumpBuf=0; p.dashT=0; dust(p.x+11,p.y+p.h,4); p.sx=.78; p.sy=1.25; SFX.play('jump');
    } else if (wl || wr || p.wallCoy>0){
      const side = wr ? 1 : wl ? -1 : p.wallSide;
      // Giữ hướng vào tường = bật ngắn để leo; không giữ = bật xa ra khỏi tường
      const climbHop = dir === side;
      p.vy=-WALLJUMP_Y; p.vx=-side*(climbHop ? 110 : WALLJUMP_X); p.lock=climbHop ? .06 : WALLJUMP_LOCK;
      p.face=-side; p.dashT=0; p.wallCoy=0; jumpBuf=0; p.sx=.8; p.sy=1.2; SFX.play('walljump');
      dust(p.x+(side>0?p.w:0), p.y+20, 5, -side);
    } else if (p.airJ>0){
      p.airJ--; p.vy=-JUMP*.92; p.dashT=0; jumpBuf=0; p.sx=.8; p.sy=1.22; p.flipT=.35; SFX.play('airjump');
      for (let i=0;i<8;i++){ const a=i/8*Math.PI*2; parts.push({x:p.x+11,y:p.y+p.h,vx:Math.cos(a)*160,vy:Math.sin(a)*60,a,va:0,l:6,life:.4}); }
    }
  }

  // Ngang
  if (p.dashT>0){
    p.dashT-=dt; p.vx=p.dashDir*DASH_SPEED; p.vy=0;
    ghosts.push({x:p.x,y:p.y,faceS:p.faceS,sx:p.sx,sy:p.sy,life:.22,ink:p.inkDash});
    if (p.dashT<=0) p.vx = p.dashDir*SPEED;
  } else if (p.lock<=0){
    const a = (p.ground?ACC_GROUND:ACC_AIR)*dt;
    // vừa buông dây: giữ quán tính (không tự hãm), chỉ bấm ngược chiều mới giảm tốc
    const keepFling = p.flingT > 0 && !p.ground && Math.abs(p.vx) > SPEED && (dir===0 || Math.sign(dir)===Math.sign(p.vx));
    if (!keepFling) p.vx += clamp(dir*SPEED*(inWater?SWIM_SPEED:1)*(p.crouch?CROUCH_SPEED:1) - p.vx, -a, a);
  }
  // đang đẩy thùng? (kể cả thùng nổi cao thấp lệch chân): chậm lại và tốn mực vì phải thắng ma sát
  p.pushing = (p.ground || p.inWater) && dir!==0 && p.dashT<=0 && boxes.some(b=>b.y < p.y+p.h-4 && b.y+b.h > p.y+6 && (dir>0 ? Math.abs(b.x-(p.x+p.w))<3 : Math.abs(b.x+b.w-p.x)<3));
  let pushK = 1;
  if (p.pushing){
    if (dev.ink || mana > 0){ pushK = PUSH_SLOW; mana = Math.max(0, mana - PUSH_COST*dt); }
    else { pushK = PUSH_TIRED; if (!p.pushWarn){ p.pushWarn = 1.5; manaFlash = .5; popups.push({x:p.x+11, y:p.y-14, text:'hết mực: đẩy rất chậm', life:1.4}); } }
    if (!pushTold){ pushTold = true; popups.push({x:p.x+11, y:p.y-30, text:'Đẩy thùng: thắng ma sát → chậm, tốn mực', life:2.4}); }
  }
  p.pushWarn = Math.max(0, (p.pushWarn||0) - dt);
  const bx = p.x, want = p.vx*dt*pushK;
  moveX(p, want);
  if (Math.abs((p.x-bx)-want) > .01 && p.dashT<=0) p.vx = 0;
  { const w = windAt(p.x+11, p.y+17); p.windW = w; if (w && p.dashT<=0) moveX(p, w*WIND_V*(p.ground ? .65 : 1.25)*dt); }
  if (p.ground && dir) p.anim += dt*12;

  // Dọc
  if (p.dashT<=0){
    if (p.springT>0 && p.vy>=0) p.springT = 0;
    const cut = p.vy<0 && !inp.jump && !(p.springT>0) && !inSteam;
    p.vy += G*dt*(inWater ? SWIM_G : cut ? JUMP_CUT : 1);
    p.vy = Math.min(p.vy, inWater ? SWIM_MAX : FALL_MAX);
    if (inSteam){ p.vy = Math.max(-STEAM_MAX, p.vy - STEAM_LIFT*dt); if (Math.random()<.2) dust(p.x+11,p.y+p.h,1); }
  }
  // độ cao đỉnh của cú rơi (cho lò xo)
  if (p.ground || inWater || inSteam || p.wall) p.apexY = p.y+p.h; else p.apexY = Math.min(p.apexY ?? p.y+p.h, p.y+p.h);
  // Bám tường
  p.wall = 0;
  if (!p.ground && !inWater && p.dashT<=0 && p.vy>-80){
    if (wr && dir>0) p.wall = 1; else if (wl && dir<0) p.wall = -1;
  }
  if (p.wall){
    p.canDash = true; p.wallCoy = .1; p.wallSide = p.wall; p.face = p.wall;
    if (p.vy > WALL_SLIDE){ p.vy = WALL_SLIDE; }
    if (Math.random()<.3) dust(p.x+(p.wall>0?p.w:0), p.y+6, 1, -p.wall*.3);
  } else p.wallCoy -= dt;

  const wasGround = p.ground, fallV = p.vy;
  moveY(p, p.vy*dt);
  if (p.ground){
    p.coy=.08; p.airJ=0; if (p.dashT<=0) p.canDash=true;
    // lò xo: bật lại theo độ cao đã rơi (bảo toàn năng lượng)
    const fy = Math.floor((p.y+p.h+2)/T), sxs = [Math.floor((p.x+2)/T), Math.floor((p.x+p.w-2)/T)];
    const spr = sxs.find(tx=>grid[fy] && grid[fy][tx]==='S');
    if (spr!==undefined && !wasGround && fallV>0){
      const drop = Math.max(0, p.y+p.h - (p.apexY ?? p.y+p.h));
      const v = Math.max(SPRING_MIN, Math.sqrt(2*G*drop)*SPRING_KEEP);
      p.vy = -v; p.ground = false; p.coy = 0; p.springT = 2; p.sx=.7; p.sy=1.35; p.apexY = p.y+p.h; SFX.play('boing', v);
      for (const tx of sxs) springA[tx+','+fy] = 1;
      popups.push({x:p.x+11, y:p.y-6, text:'h ≈ '+Math.round(v*v/(2*G)/T*10)/10+' ô', life:1});
    } else if (!wasGround){ dust(p.x+11,p.y+p.h,3); const k=clamp(fallV/FALL_MAX,0,1); p.sx=1+.35*k; p.sy=1-.32*k; if (fallV>760){ shakeT=.18; dust(p.x+11,p.y+p.h,6); SFX.play('thud'); } else SFX.play('land', k); }
  }
  else p.coy -= dt;
  heroAnim(p, dt);
  // tiếng bước chân theo nhịp chân, đổi theo chất liệu sàn từng khu
  const stepN = Math.floor(p.runT/Math.PI);
  if (p.ground && (p.st==='run'||p.st==='push'||p.st==='crawl') && stepN !== p.lastStep){ SFX.play('step', LEVELS[lvl].theme); if (p.st==='crawl' && Math.random()<.5) dust(p.x+11, p.y+p.h, 1); }
  p.lastStep = stepN;
  if (inWater && !p.wasWet && p.vy > 100) SFX.play('splash');
  p.wasWet = inWater;
  SFX.loop('slide', p.wall && p.vy>20 ? 1 : 0);
  SFX.loop('push', p.pushing && Math.abs(p.vx)>5 ? 1 : 0);
  SFX.loop('wind', p.dashT>0 || (!p.ground && p.vy>600) ? 1 : 0);
}

function update(dt){
  clock += dt;
  if (swapFx){ swapFx.t += dt; if (swapFx.t > SWAP_DUR) swapFx = null; }
  if (state==='play'){ saveT -= dt; if (saveT <= 0){ saveT = 5; saveGame(); } }
  updateTnt(dt); updateRopes(dt);
  if (bestiary){ updateBestiary(dt); return; }
  if (devMenu) return;
  if (dev.ink) mana = MANA_MAX;
  for (const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=1400*dt; p.a+=p.va*dt; p.life-=dt*1.2; }
  parts = parts.filter(p=>p.life>0); if (parts.length > (PERF.low ? MAX_PARTS/2 : MAX_PARTS)) parts.splice(0, parts.length - (PERF.low ? MAX_PARTS/2 : MAX_PARTS));
  for (const g of ghosts) g.life-=dt; ghosts = ghosts.filter(g=>g.life>0);
  if (state==='title' || state==='end') updateMenuHero(dt);
  if (state==='story'){
    const c0 = Math.floor(story.t*CPS); story.t += dt; const c1 = Math.floor(story.t*CPS);
    if (c1 > c0 && c1 <= panelLen(story.q[story.i]) && c1 % 2 === 0) SFX.play('tick');
    updateSceneHero(dt); return; }
  if (reading){ reading.t += dt; return; }
  if (bossCS && state==='play'){ shakeT -= dt; updateAmbience(dt); updateZoom(dt); updateBossCS(dt); updateCam(dt, false); updateCrow(dt);
    for (const u of popups){ u.life-=dt; u.y-=dt*24; } popups = popups.filter(u=>u.life>0);

function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
const hash2 = (a,b) => { const v = Math.sin(a*127.1 + b*311.7)*43758.5453; return v - Math.floor(v); };

  for (const m of motes){ m.ph += dt*(.4+m.s*.6); m.x += Math.sin(m.ph)*6*dt + 4*dt; m.y += Math.cos(m.ph*.7)*5*dt - 2*dt; }

}
// Nền xa: trôi chậm hơn (thị sai), nét xám nhạt để không lấn gameplay

function drawStory(){
  if (!sceneHero) updateSceneHero(0);
  const P = story.q[story.i], W = innerWidth, H = innerHeight;
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  const bw = Math.min(680, W-32), sc = bw/600, sh = 240*sc, bx = (W-bw)/2;
  const textH = 120, total = sh + textH + 40, by = Math.max(16, (H-total)/2);
  // khung tranh
  ctx.save(); ctx.translate(bx, by); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.strokeRect(0,0,bw,sh);
  ctx.beginPath(); ctx.rect(0,0,bw,sh); ctx.clip(); ctx.scale(sc,sc);
  if (P.scene==='chapter'){
    drawChapterIcon(P.icon, 300, 80);
    ctx.fillStyle=INK; ctx.font=`400 34px ${HAND}`; ctx.textAlign='center';
    const shown = P.title.slice(0, Math.floor(story.t*CPS));
    ctx.fillText(shown, 300, 176); ctx.lineWidth=1.5; line(220,192,380,192);
  } else drawScene(P.scene);
  ctx.restore();
  // chữ gõ dần
  let budget = Math.floor(story.t*CPS) - (P.title ? P.title.length : 0);
  ctx.font = `400 ${Math.max(20, Math.min(26, bw/26))}px ${HAND}`; ctx.fillStyle=INK; ctx.textAlign='left';
  let ty = by + sh + 38;
  for (const ln of P.lines){
    if (budget <= 0) break;
    const part = ln.slice(0, budget); budget -= ln.length;
    for (const w of wrapText(part, bw-16)){ ctx.fillText(w, bx+8, ty); ty += 28; }
  }
  // chấm trang + gợi ý
  const n = story.q.length;
  for (let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(W/2-(n-1)*9+i*18, by+sh+textH+12, 4, 0, Math.PI*2); i<=story.i ? ctx.fill() : (ctx.lineWidth=1.5, ctx.stroke()); }
  ctx.font=`400 12px ${FONT}`; ctx.textAlign='center';
  const done = story.t*CPS >= panelLen(P);
  ctx.globalAlpha = done ? .5+.5*Math.sin(clock*4) : .4;
  ctx.fillText(done ? 'Enter / chạm để tiếp  ·  Esc bỏ qua' : 'Enter / chạm để hiện hết  ·  Esc bỏ qua', W/2, by+sh+textH+36);
  ctx.globalAlpha = 1;
}

      text('PHÒNG KÍN', cx, cy+64, Math.min(52,w/6.5), 700);
      text(`Chương ${CHAPTER.no} · ${CHAPTER.title}`, cx, cy+98, Math.min(15,w/32), 600);
      text('←→ đi · ↑/Z nhảy · ↓/S cúi · Q lướt · F ném lọ · X đổi lọ', cx, cy+124, sm, 400);
      text('E gạt cần · R chơi lại cả khu · M tắt/bật tiếng', cx, cy+144, sm, 400);
    } else {
      const m=Math.floor(endTime/60), s=Math.floor(endTime%60);
      text(LAST_CH.partial ? `CHƯƠNG ${LAST_CH.no} · CÒN TIẾP` : `HẾT CHƯƠNG ${LAST_CH.no}`, cx, cy+66, Math.min(40,w/11), 700);
      text(`Còn tiếp: ${LAST_CH.next}…`, cx, cy+136, 13, 400);
      text(`${m}:${String(s).padStart(2,'0')}  ·  chết ${deaths} lần  ·  nhật ký ${gotPages.size}/${PAGE_TOTAL}  ·  hạc giấy ${gotSecrets.size}/${SECRET_TOTAL}`, cx, cy+110, 16, 400);
    }
    const sv = state==='title' ? loadSave() : null;
    if (sv){
      const L = LEVELS[sv.lvl], lab = L.side ? 'Chương phụ' : `Ch.${chOf(sv.lvl)} · Phần ${partNo(sv.lvl)}`;
      text(Math.floor(clock*2)%2 ? `Enter / chạm: TIẾP TỤC (${lab} · ${L.name})` : '', cx, Math.min(innerHeight-40, cy+h/2+28), 14, 600);
      const bw = 150, bh = 26, bx2 = cx - bw/2, by2 = Math.min(innerHeight-34, cy+h/2+40);
      titleNewBtn = {x:bx2, y:by2, w:bw, h:bh}; ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.strokeRect(bx2, by2, bw, bh);
      text('N: chơi mới', cx, by2+18, 12, 400);
    } else { titleNewBtn = null;
      text(Math.floor(clock*2)%2 ? (state==='title' ? 'nhấn Enter hoặc chạm để vào' : 'nhấn Enter hoặc chạm để chơi lại') : '', cx, Math.min(innerHeight-16, cy+h/2+34), 14, 600); }
    return;
  }

  // HUD
  const L = LEVELS[lvl], nSeg = L.hints.length;
  text(`CH.${chOf(lvl)} · ${L.side ? 'CHƯƠNG PHỤ' : `PHẦN ${partNo(lvl)}/${PARTS_OF(chOf(lvl))}`} · ${L.name.toUpperCase()}`, OX, 34, 14, 700, 'left');
  text(`nhật ký ${gotPages.size}/${PAGE_TOTAL}  ·  hạc ${gotSecrets.size}/${SECRET_TOTAL}  ·  chết: ${deaths}`, OX+viewW*S, 34, 14, 400, 'right');
  // thanh tiến độ: các đoạn của khu
  for (let i=0;i<nSeg;i++){
    const bw=18, bx=innerWidth/2-(nSeg*(bw+6))/2+i*(bw+6);
    ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.strokeRect(bx,10,bw,7);
    if (i<=cpSeg){ ctx.fillStyle=INK; ctx.fillRect(bx,10,bw,7); }
    if (i===curSeg){ ctx.fillStyle=INK; ctx.fillRect(bx,20,bw,2); }
  }
  const hint = jamT>0 ? 'Kẹt rồi. Có gì đó đang chắn chỗ đó.' : L.hints[curSeg];
  ctx.globalAlpha = jamT>0 ? 1 : Math.min(1, .45 + Math.max(0,msgT)*.3);
  text(hint, innerWidth/2, OY-8, Math.max(10, Math.min(14, viewW*S/60)), 400);
  ctx.globalAlpha = 1;

  // Khung nhìn + camera
  ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,viewW,viewH); ctx.clip();
  ctx.fillStyle = L.theme==='fallen' ? '#d4d4cf' : L.theme==='outside' ? '#f2f1ec' : WALL; ctx.fillRect(0,0,viewW,viewH);
  drawBackdrop();
  if (!PERF.low) drawMotes();
  const shk = shakeT>0 ? shakeT*16 : 0;
  ctx.translate(-Math.round(camX*S)/S + (Math.random()-.5)*shk, -Math.round(camY*S)/S + (Math.random()-.5)*shk);
  drawLightPools(L);
  ctx.save(); ctx.globalAlpha = DECOR_ALPHA;
  for (const d of L.decor) if (Math.abs(d[1]*T - (camX+viewW/2)) < viewW/2+200) drawDecor(d);
  drawCeiling(L);
  ctx.restore();
  const x0=Math.max(0,Math.floor(camX/T)), x1=Math.min(GW-1,Math.ceil((camX+viewW)/T));
  const y0=Math.max(0,Math.floor(camY/T)), y1=Math.min(GH-1,Math.ceil((camY+viewH)/T));
  drawAO(x0,x1,y0,y1);
  cachedWalls(x0, x1);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){ const c=grid[y][x]; if (c!=='.' && c!=='#') drawTile(c,x,y); }
  if (pulley) drawPulley();
  if (heaterOn) drawSteam();
  for (const k of keyItems) if (!k.got) drawKey(k);
  for (const c of crystals) drawCrystal(c);
  for (const o of orbs) drawOrb(o);
  for (const d of diary) drawDiaryItem(d);
  for (const q of secrets) drawSecret(q);
  for (const s of saws) drawSaw(s);
  for (const q of pendulums) drawPendulum(q);
  drawRopes();
  drawBeams();
  drawLeverFx();
  for (const b of boxes) contactShadow(b, 1);
  if (state!=='dying') contactShadow(player, .9);
  for (const b of boxes) drawBox(b);
  drawPrompts();
  if (LEVELS[lvl].combat){ ENEMY_LOOK = {x:player.x+11, y:player.y+17}; drawDecals(); drawSpawns(); const vis = e => e.x+e.w > camX-80 && e.x < camX+viewW+80 && e.y+e.h > camY-80 && e.y < camY+viewH+80; for (const e of enemies) if (vis(e)) contactShadow(e, e.fly ? .45 : .9); for (const e of enemies) if (vis(e)) drawEnemy(e); drawBoss(); }
  for (const g of ghosts){ ctx.globalAlpha=g.life*2.2; drawHero({x:g.x,y:g.y,h:34,faceS:g.faceS,sx:g.sx,sy:g.sy,pose:player.pose,st:'dash',scarf:[],pk:player.pk},{ghost:true,ink:g.ink}); }
  ctx.globalAlpha=1;
  if (state!=='dying'){
    // viền sáng (rim light) tách nhân vật khỏi nền tối
    ctx.save(); if (!PERF.low){ ctx.shadowColor='rgba(255,255,255,.95)'; ctx.shadowBlur=7*S*DPR; } if (player.invT>0 && Math.floor(clock*20)%2) ctx.globalAlpha=.35;
    if (player.rope){ const hx = player.x+11, hy = player.y+6; ctx.translate(hx, hy); ctx.rotate(-player.ropeTh); ctx.translate(-hx, -hy); }
    drawHero(player); ctx.restore();
    drawSwapFx();
  }
  ctx.save(); if (!PERF.low){ ctx.shadowColor='rgba(255,255,255,.9)'; ctx.shadowBlur=5*S*DPR; } drawCrow(); ctx.restore();
  if (LEVELS[lvl].combat) drawCombatFX();
  if (LEVELS[lvl].combat) drawDarkness();
  drawTnt();
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineCap='round';
  for (const p of parts){ ctx.globalAlpha=Math.max(0,p.life); line(p.x-Math.cos(p.a)*p.l/2,p.y-Math.sin(p.a)*p.l/2,p.x+Math.cos(p.a)*p.l/2,p.y+Math.sin(p.a)*p.l/2); }
  for (const u of popups){
    ctx.globalAlpha=Math.min(1,u.life*2); ctx.font=`700 ${u.big?15:11}px ${FONT}`; ctx.textAlign='center';
    if (u.big){ const tw=ctx.measureText(u.text).width+16; ctx.fillStyle=PAPER; ctx.fillRect(u.x-tw/2,u.y-15,tw,22); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(u.x-tw/2,u.y-15,tw,22); }
    ctx.fillStyle=INK; ctx.fillText(u.text,u.x,u.y); }
  ctx.globalAlpha=1;
  ctx.restore();
  if (!PERF.low) { ctx.save(); ctx.beginPath(); ctx.rect(0,0,viewW,viewH); ctx.clip(); drawForeground(); ctx.restore(); }
  if (flashT > 0){ ctx.save(); ctx.globalAlpha = Math.min(1, flashT/.22)*.85; ctx.fillStyle = PAPER; ctx.fillRect(0,0,viewW,viewH); ctx.restore(); }
  // hiệu ứng chuyển khu / chết (theo khung nhìn)
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,viewW,viewH); ctx.clip();
  if (state==='trans'){
    const k = tState<.45 ? tState/.45 : 1-(tState-.45)/.45;
    ctx.fillStyle=INK; ctx.fillRect(0,0,viewW*k,viewH);
  }
  if (state==='dying'){ ctx.fillStyle=INK; ctx.globalAlpha=Math.max(0,tState-.35)*2; ctx.fillRect(0,0,viewW,viewH); ctx.globalAlpha=1; }
  ctx.restore();
  // thanh mực (góc trên trái khung nhìn) + sổ tay khoa học (góc phải)
  if (reading) drawReading();
  drawBossCSOverlay();
  if (!bossCS){ drawManaHUD(); drawCombatHUD(); drawBossLine(); }
  drawNotes();
  // nút loa (cạnh thanh mực): bấm hoặc nhấn M
  { const sx = 184, sy = 29; ctx.save(); ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(sx,sy,13,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=INK;
    ctx.beginPath(); ctx.moveTo(sx-7,sy-3); ctx.lineTo(sx-4,sy-3); ctx.lineTo(sx,sy-7); ctx.lineTo(sx,sy+7); ctx.lineTo(sx-4,sy+3); ctx.lineTo(sx-7,sy+3); ctx.closePath(); ctx.fill();
    if (SFX.muted){ line(sx+2,sy-4,sx+8,sy+4); line(sx+8,sy-4,sx+2,sy+4); }
    else { ctx.beginPath(); ctx.arc(sx+1,sy,4,-.8,.8); ctx.stroke(); ctx.beginPath(); ctx.arc(sx+1,sy,7.5,-.8,.8); ctx.stroke(); }
    ctx.restore(); }
  if (state==='dying' && bossLoss && tState>.5){
    const a = Math.min(1,(tState-.5)*2);
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=INK; ctx.fillRect(0,0,viewW,viewH);
    ctx.fillStyle=PAPER; ctx.textAlign='center'; ctx.font=`400 ${Math.min(30,viewW/16)}px ${HAND}`;
    ctx.fillText('Vua Mực đã nuốt chửng ngọn lửa…', viewW/2, viewH/2-10);
    ctx.font=`400 12px ${FONT}`; ctx.fillText('Làm lại trận Ngai Vua Mực', viewW/2, viewH/2+20);
    ctx.restore();
  }
  if (leverAct && leverAct.lb > 0){ const h = viewH*.09*leverAct.lb; ctx.fillStyle = INK; ctx.fillRect(0,0,viewW,h); ctx.fillRect(0,viewH-h,viewW,h); }
  // viền khung nhìn
  ctx.strokeStyle=INK; ctx.lineWidth=2/S; ctx.strokeRect(0,0,viewW,viewH);

  if (touchUI){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    for (const b of BTN()){
      const held=[...ptrs.values()].includes(b.id);
      ctx.lineWidth=2.5; ctx.strokeStyle=INK; ctx.fillStyle=held?INK:PAPER;
      ctx.beginPath(); ctx.arc(b.x,b.y,34,0,Math.PI*2); ctx.fill(); ctx.stroke();
      text(b.l,b.x,b.y+7,20,700,'center',held?PAPER:INK);
    }
  }
}

resize();
let last=performance.now();
// Chọn nhạc nền theo trạng thái game
function pickMusic(){
  if (state==='title' || state==='end') return ['house',1];
  if (state==='story') return ['story',1];
  if (bossCS) return ['heart',1];
  if (boss && boss.engaged && !boss.dead) return boss.phase===4 ? ['heart',1] : ['boss', boss.phase];
  const th = LEVELS[lvl] && LEVELS[lvl].theme;
  return [{house:'house', basement:'basement', lab:'lab', fallen:'fallen', outside:'outside'}[th] || 'house', 1];
}
function loop(now){ const dt=Math.min(1/30,(now-last)/1000); last=now;
  PERF.ema += ((dt*1000) - PERF.ema)*.05; if (state==='play'){ if (PERF.ema > 24){ PERF.slowT += dt; if (PERF.slowT > 2 && !PERF.auto){ PERF.auto = true; resize(); } } else PERF.slowT = Math.max(0, PERF.slowT - dt*.5); } update(dt); draw(); const [mn, mi] = pickMusic(); SFX.music(mn, mi); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
