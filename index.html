 { name:"Thềm Phương Trình", ch:5, numRule:"ineq", item:"vboots", pages:["Phương trình là một cái cân. Làm gì với vế này thì phải làm y như thế với vế kia.", "Bất phương trình thì rộng lượng hơn: không chỉ một đáp án, mà cả một khoảng."], talks:[[6, 15, "Cạc! Tháp Đồ Thị bắt đầu từ đây. Tìm x thôi!"], [30, 15, "Ô số: chỉ x thoả 2x − 1 > 7 mới vững."], [74, 15, "x² = 49… cẩn thận cái bẫy 24,5!"]], hints:["Giải phương trình: chuyển vế, đổi dấu.", "Ô số: chỉ x thoả 2x − 1 > 7 (tức x > 4) mới vững.", "Nhân phân phối hoặc chia hai vế cho 3.", "Căn bậc hai: x = √49."], notes:[["PHƯƠNG TRÌNH", "ax + b = c → x = (c − b) ÷ a", "2x + 3 = 11 → x = 4", ""], ["BẤT PHƯƠNG TRÌNH", "2x − 1 > 7 ⇔ 2x > 8 ⇔ x > 4", "Nghiệm: 5, 6, 7…", "4 không thoả (dấu > )"], ["PHÂN PHỐI", "a(b + c) = ab + ac", "3(x − 2) = 3x − 6", ""], ["CĂN BẬC HAI", "x² = 49 → x = ±7", "x > 0 → x = 7", ""]], secrets:["Hạc giấy hình cái cân: “Đừng chỉ cân vế của mình. Hãy nhìn cả vế bên kia.”"], decor:[["sign", 8, "PHƯƠNG TRÌNH"], ["board", 40, 3]], combat:true, theme:"math", math:true, nums:[9, 4, 6, 0, 8, 0, 7, 4, 3, 10, 5, 1, 1, 6, 5, 0, 3, 10, 3, 10, 9, 3, 0, 7, 9], quiz:[{q:"2x + 3 = 11. x = ?", opts:["7", "5", "4"], ans:2, kind:"door", hint:"chuyển 3 sang vế phải rồi chia 2", why:"2x = 8 → x = 4"}, {q:"3(x − 2) = 12. x = ?", opts:["2", "4", "6"], ans:2, kind:"door", hint:"chia 3 trước: x − 2 = 4", why:"x − 2 = 4 → x = 6"}, {q:"x² = 49 và x > 0. x = ?", opts:["7", "24,5", "49"], ans:0, kind:"bridge", hint:"x² nghĩa là x × x, không phải 2x", why:"7 × 7 = 49"}],

 { name:"Cầu Đồ Thị", ch:5, pages:["Một hàm số là một lời hứa: đưa nó x nào, nó trả lại đúng một y.", "Đồ thị là con đường mà lời hứa ấy vẽ ra. Chọn sai hàm, đường sẽ dẫn con đi lạc."], talks:[[6, 19, "Chọn đúng hàm số, đồ thị sẽ thành cây cầu!"], [36, 19, "Đích ở (16; 8). Thay x vào thử xem."], [69, 19, "Lần này đích ở (12; 8)."]], hints:["Chạm quả cầu mang hàm số đúng: đồ thị của nó hiện thành bậc phấn. Sai thì chỉ thấy bóng đồ thị.", "Hệ số góc: số đứng trước x.", "Thay x = 12 để kiểm tra từng hàm.", "Leo lên bệ cao để tới lối ra."], notes:[["HÀM BẬC NHẤT", "y = ax + b", "Đồ thị là đường thẳng", "Thay toạ độ đích để thử"], ["HỆ SỐ GÓC", "a > 0: đi lên · a < 0: đi xuống", "y = 3x − 2: a = 3, b = −2", ""], ["TUNG ĐỘ GỐC", "b: chỗ cắt trục Oy", "y = 0,5x + 2 cắt Oy tại 2", ""], ["", "", "", ""]], secrets:["Hạc giấy kẻ ô vuông: “Hai đường thẳng không song song thì sớm muộn cũng gặp nhau.”"], decor:[["sign", 8, "ĐỒ THỊ"], ["board", 20, 3]], combat:true, theme:"math", math:true, quiz:[{q:"Hàm nào đi qua đích (16; 8)?", opts:["y = x", "y = 2x", "y = x ÷ 2"], ans:2, kind:"graph", hint:"thay x = 16 vào từng hàm", why:"16 ÷ 2 = 8: đồ thị chạm đúng đích", g:{ox:38, oy:21, x0:1, x1:16, ymax:9, target:[16, 8], fs:[x=>x, x=>2*x, x=>x/2]}}, {q:"Hệ số góc của y = 3x − 2?", opts:["−2", "3", "1"], ans:1, kind:"door", hint:"y = ax + b: a là hệ số góc", why:"a = 3: x tăng 1 thì y tăng 3"}, {q:"Hàm nào đi qua (12; 8)?", opts:["y = x + 2", "y = 0,5x + 2", "y = 2x − 3"], ans:1, kind:"graph", hint:"0,5 × 12 + 2 = ?", why:"0,5 × 12 + 2 = 8", g:{ox:72, oy:21, x0:1, x1:12, ymax:9, target:[12, 8], fs:[x=>x+2, x=>0.5*x+2, x=>2*x-3]}}],

 { name:"Vườn Parabol", ch:5, numRule:"root", pages:["Ném một hòn đá lên trời, nó sẽ vẽ một parabol. Bay lên, chậm dần, dừng lại một khoảnh khắc ở đỉnh, rồi rơi.", "Ta thích cái khoảnh khắc ở đỉnh ấy nhất. Không lên, không xuống. Chỉ lơ lửng."], talks:[[6, 19, "Ô số ở đây là nghiệm của x² − 5x + 6 = 0!"], [36, 19, "Cột gai cao quá. Cần một đường cong vòng qua."], [72, 19, "Lại nghiệm phương trình. Chỉ có hai số thôi."]], hints:["Ô số: chỉ x = 2 hoặc x = 3 (nghiệm của x² − 5x + 6 = 0) mới vững.", "Chọn parabol úp xuống, cao vừa đủ vượt cột gai.", "Dạng đỉnh: y = (x − h)² + k.", "Cầu nghiệm cuối cùng: chỉ bước lên 2 và 3."], notes:[["PHƯƠNG TRÌNH BẬC HAI", "x² − 5x + 6 = 0", "= (x − 2)(x − 3)", "Nghiệm: x = 2, x = 3"], ["PARABOL", "y = ax² + bx + c", "a > 0: ∪ · a < 0: ∩", "Đỉnh: x = −b ÷ 2a"], ["DẠNG ĐỈNH", "y = a(x − h)² + k", "Đỉnh (h; k)", ""], ["VI-ÉT", "x₁ + x₂ = 5", "x₁ · x₂ = 6", ""]], secrets:["Hạc giấy cong như parabol: “Ở đỉnh cao nhất, vận tốc theo phương đứng bằng 0. Nghỉ một chút cũng được.”"], decor:[["sign", 8, "PARABOL"], ["board", 60, 3]], combat:true, theme:"math", math:true, nums:[2, 8, 2, 9, 3, 4, 2, 5, 2, 1, 2, 1, 3, 1, 3, 5, 2, 8, 2, 2, 5, 3, 1, 2, 1, 3, 2, 5, 3, 2, 0, 2, 4, 3, 2, 1, 3, 2, 5, 3, 1, 3, 5, 2, 4, 2, 0, 2], quiz:[{q:"Đồ thị nào vượt qua cột gai và đáp xuống (12; 0)?", opts:["y = x²", "y = (x − 6)²", "y = −(x − 6)² ÷ 6 + 6"], ans:2, kind:"graph", hint:"cần đường cong úp xuống, đỉnh cao 6", why:"parabol úp (a < 0), đỉnh (6; 6)", g:{ox:44, oy:21, x0:1, x1:12, ymax:8, target:[12, 0], fs:[x=>x*x, x=>(x-6)*(x-6), x=>-(x-6)*(x-6)/6+6]}}, {q:"Đỉnh của y = (x − 3)² + 1?", opts:["(−3; 1)", "(3; 1)", "(1; 3)"], ans:1, kind:"door", hint:"y = (x − h)² + k có đỉnh (h; k)", why:"h = 3, k = 1"}],

 { name:"Xưởng Sóng Sin", ch:5, sineA:2, sineW:1.4, pages:["Sóng sin là thứ quay về. Lên cao nhất, xuống thấp nhất, rồi lại bắt đầu y như cũ, mãi mãi.", "Nhịp tim, con lắc, mặt biển, tiếng đàn: mọi thứ lặp lại đều mang trong mình một chữ sin."], talks:[[6, 17, "Bệ dập dình theo y = 2·sin(t + φ). Canh nhịp mà nhảy!"], [68, 17, "Hai con lắc đung đưa. T = 2π√(L/g)."], [89, 17, "Cos 0° bằng bao nhiêu nhỉ?"]], hints:["Lượng giác: tam giác vuông có góc 30°.", "Bệ sin: nhảy lên khi bệ ở thấp, nhảy sang khi hai bệ ngang nhau.", "Canh nhịp hai con lắc rồi chạy qua.", "cos là hoành độ của điểm trên đường tròn đơn vị."], notes:[["LƯỢNG GIÁC", "sin = đối ÷ huyền", "cos = kề ÷ huyền", "sin 30° = 1/2 · cos 60° = 1/2"], ["SÓNG SIN", "y = A·sin(ωt + φ)", "A: biên độ · φ: pha", "Mỗi bệ lệch pha một chút"], ["CHU KỲ", "T = 2π ÷ ω", "Con lắc: T = 2π√(L/g)", ""], ["ĐƯỜNG TRÒN ĐƠN VỊ", "cos 0° = 1 · sin 0° = 0", "cos 90° = 0 · sin 90° = 1", ""]], secrets:["Hạc giấy gợn sóng: “Thứ gì đã đi xa, theo nhịp của nó, sẽ quay về.”"], decor:[["sign", 8, "SÓNG SIN"], ["board", 60, 3]], combat:true, theme:"math", math:true, quiz:[{q:"sin 30° = ?", opts:["√3/2", "1", "1/2"], ans:2, kind:"door", hint:"nửa tam giác đều cạnh 1", why:"sin 30° = cạnh đối ÷ cạnh huyền = 1/2"}, {q:"Chu kỳ của y = sin x?", opts:["π", "π/2", "2π"], ans:2, kind:"door", hint:"một vòng tròn đầy đủ", why:"sin(x + 2π) = sin x"}, {q:"cos 0° = ?", opts:["0", "−1", "1"], ans:2, kind:"bridge", hint:"điểm (1; 0) trên đường tròn đơn vị", why:"cos 0° = 1"}],

 { name:"Bệ Phóng Vectơ", ch:5, pages:["Vectơ không chỉ cho biết nhanh bao nhiêu, mà còn cho biết đi về đâu. Ta ước gì cuộc đời mình cũng có mũi tên.", "Bất kỳ cú nhảy nào cũng tách được làm hai: một phần đi ngang, một phần đi lên. vx = v·cosθ, vy = v·sinθ."], talks:[[6, 19, "Bệ phóng! Giữ E chỉnh góc, nhảy để bay."], [58, 19, "Có gió thổi ngang: vectơ gió cộng vào vận tốc!"], [87, 19, "Bay ngược lên cao tới lối ra."]], hints:["Độ dài vectơ (a; b) = √(a² + b²).", "Đứng trên bệ phóng: GIỮ E để chỉnh góc θ (thêm ← để giảm), nhảy để phóng. Đường chấm là quỹ đạo.", "Gió đẩy thêm theo phương ngang: chọn góc thấp hơn một chút.", "Bệ cuối: góc lớn để bay cao lên bệ lối ra."], notes:[["VECTƠ", "|(a; b)| = √(a² + b²)", "(3; 4) → 5", ""], ["PHÂN TÍCH VẬN TỐC", "vx = v·cosθ · vy = v·sinθ", "θ = 45°: bay xa nhất", "θ lớn: bay cao, θ nhỏ: bay thấp"], ["CỘNG VECTƠ", "(a; b) + (c; d) = (a + c; b + d)", "Gió + vận tốc = vận tốc mới", ""], ["TẦM XA", "L = v²·sin2θ ÷ g", "", ""]], secrets:["Hạc giấy hình mũi tên: “Đừng chỉ hỏi mình đi nhanh thế nào. Hỏi xem mình đang hướng về đâu.”"], decor:[["sign", 8, "VECTƠ"], ["board", 60, 3]], combat:true, theme:"math", math:true, quiz:[{q:"Độ dài vectơ (3; 4)?", opts:["7", "12", "5"], ans:2, kind:"door", hint:"dùng Pythagore: √(3² + 4²)", why:"√(9 + 16) = 5"}, {q:"(1; 2) + (3; −1) = ?", opts:["(4; 3)", "(2; 3)", "(4; 1)"], ans:2, kind:"door", hint:"cộng từng toạ độ: x với x, y với y", why:"(1 + 3; 2 − 1) = (4; 1)"}],

        popups.push({x:b.x+b.w/2, y:b.y-20, text:'PHÙ! Mọi ngọn đèn tắt', life:1.8, big:true}); }

    case 'exposed': {

      if (b.exposeT <= 0){ b.shield = true; b.st = 'snuff'; b.stT = 2.2; b.snuffed = false; bossSay('Ha… ngọn lửa nào rồi cũng tắt.'); }
      break; }
    case 'fan': {
      bossGoto(b, cxm + Math.sign(cxm-px)*1.5*T, A.top + 2.5*T, dt, 3); b.tell = b.fired ? 0 : 1;

      b.floodT += dt; b.tell = b.floodT < 1.5 ? 1 : 0;

      if (b.floodT < 1.5 && Math.random()<.5) bubbles.push({x:A.L+Math.random()*(A.R-A.L), y:A.floor-4, vy:-40, r:2+Math.random()*2, life:.6});
      if (b.stT<=0){ b.st='idle'; b.stT=.9/k; b.flood=0; }

    case 'vortex': {
      const v = b.vort; bossGoto(b, cxm, A.floor - 4.3*T, dt, 3); b.tell = 0;
      v.a += dt*1.7; const cx=b.x+b.w/2, cy=b.y+b.h/2;

      break; }
  }
  // tác hại: mưa mực, xúc tu, sóng xung kích, quả cầu xoáy, lũ axit
  for (const h of b.hz){

      if (Math.hypot(h.x-px, h.y-py) < h.r+12) { h.dead = true; hurtPlayer(bossDmg(), h.x); }
      if (solid(Math.floor(h.x/T), Math.floor((h.y+h.r)/T))){ h.dead = true; for (let i=0;i<4;i++) parts.push({x:h.x,y:h.y,vx:(Math.random()-.5)*160,vy:-Math.random()*140,a:Math.random()*6,va:4,l:3,life:.35}); } }
    else if (h.type==='tent'){ h.front += h.dir*h.v*dt; h.life -= dt;
      const tail = h.front - h.dir*160, xa = Math.max(Math.min(tail, h.front), Math.min(h.x0,h.front)), xb = Math.min(Math.max(tail, h.front), Math.max(h.x0,h.front));   // đoạn xúc tu dài ~4 ô trượt ngang
      if (xb>xa && ov(p, {x:xa, y:h.y0, w:xb-xa, h:h.y1-h.y0})) hurtPlayer(bossDmg(), h.front - h.dir*20);
      if ((h.dir>0 && tail > A.R) || (h.dir<0 && tail < A.L) || h.life<=0) h.dead = true; }
    else if (h.type==='ring'){ h.r += h.v*dt; const d = Math.hypot(px-h.x, py-h.y);
      if (Math.abs(d-h.r) < 12 && p.dashT<=0) hurtPlayer(bossDmg(), h.x);
      if (h.r > 900) h.dead = true; }
    else if (h.type==='wave'){ h.x += h.dir*h.v*dt;
      if (ov(p, {x:h.x-14, y:h.y0, w:28, h:h.y1-h.y0})) hurtPlayer(bossDmg(), h.x - h.dir*20);
      if (h.x < A.L || h.x > A.R) h.dead = true; }
  }
  b.hz = b.hz.filter(h=>!h.dead);
  if (b.flood > .3 && p.y+p.h > A.floor - 22*b.flood && px > A.L && px < A.R) hurtPlayer(bossDmg(), px + (Math.random()<.5?-1:1));
  if (b.vort){ const cx=b.x+b.w/2, cy=b.y+b.h/2;
    for (let i=0;i<5;i++){ const a = b.vort.a + i/6*Math.PI*2, ox = cx+Math.cos(a)*b.vort.r, oy = cy+Math.sin(a)*b.vort.r;   // 5 quả trên 6 vị trí → chừa 1 khe
      if (Math.hypot(ox-px, oy-py) < 22) hurtPlayer(bossDmg(), ox); } }
  // chạm thân boss
  const br = {x:b.x+8, y:b.y+8, w:b.w-16, h:b.h-16};
  if (ov(p, br) && b.st!=='trans'){
    if (p.dashT>0 && !p.dashHit.has('boss')){ p.dashHit.add('boss'); dashImpact(b, true); }
    else if (p.dashT<=0 && b.st!=='stun') hurtPlayer(bossDmg(), b.x+b.w/2);
  }
}
function updateWave(dt){
  const w = wave; if (!w || w.done) return;
  updateSpawns(dt);
  const px = player.x+11;
  if (!w.active){
    if (px > w.trigger*T && px < (w.trigger+12)*T && player.ground){ w.active = true; w.idx = 0; spawnWave(); SFX.play('gate'); SFX.play('roar'); popups.push({x:px, y:player.y-30, text:'CỔNG ĐÓNG! Đợt 1/'+w.spawns.length, life:2, big:true}); }
    return;
  }
  if (!enemies.some(e=>e.wave && !e.dead) && !(w.pending && w.pending.length)){
    w.idx++;
    if (w.idx >= w.spawns.length){ w.active = false; w.done = true; SFX.play('gate'); SFX.play('exit'); popups.push({x:px, y:player.y-30, text:'Hết quái! Cổng mở.', life:2.4, big:true}); }
    else { spawnWave(); popups.push({x:px, y:player.y-30, text:'Đợt '+(w.idx+1)+'/'+w.spawns.length, life:2, big:true}); SFX.play('roar'); }
  }
}
// Quái theo đợt: mở cổng mực 1 giây trước khi xuất hiện, không bao giờ mọc ngay dưới chân Bấc
const SPAWN_DELAY = 1.0, SPAWN_SAFE = 4*T;
function spawnWave(){
  const w = wave, gates = (tiles.W||[]).map(t=>t.x), L = (Math.min(...gates)+1)*T, R = Math.max(...gates)*T, px = player.x+11;
  w.pending = [];
  for (const [c,tx,ty] of w.spawns[w.idx]){
    let x = tx*T + T/2;
    if (Math.abs(x-px) < SPAWN_SAFE){                     // quá gần → dời sang phía xa trong phòng
      const mirror = L + R - x;
      x = Math.abs(mirror-px) >= SPAWN_SAFE ? mirror : (px < (L+R)/2 ? R - 2*T : L + 2*T);
    }
    w.pending.push({c, tx:Math.floor(x/T), ty, t:SPAWN_DELAY + Math.random()*.3, fly: c==='3' || c==='6'});
  }
  SFX.play('portal');
}
function updateSpawns(dt){
  const w = wave; if (!w || !w.pending) return;
  for (const s of w.pending){
    s.t -= dt;
    const cx = s.tx*T + T/2, cy = s.fly ? s.ty*T + T/2 : (s.ty+1)*T;
    if (Math.random() < .5) parts.push({x:cx+(Math.random()-.5)*36, y:cy-(s.fly?0:2), vx:(Math.random()-.5)*30, vy:-60-Math.random()*80, a:-1.57, va:0, l:3+Math.random()*4, life:.4});
    if (s.t <= 0){
      spawnEnemy(s.c, s.tx, s.ty); const e = enemies[enemies.length-1]; e.wave = true; e.t = -.35; e.hurtT = .2;
      SFX.play('pop'); shakeT = Math.max(shakeT, .08);
      for (let i=0;i<14;i++){ const a=i/14*Math.PI*2; parts.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:Math.cos(a)*180,vy:Math.sin(a)*180-60,a,va:0,l:5,life:.5}); }
      s.done = true;
    }
  }
  w.pending = w.pending.filter(s=>!s.done);
}
function drawSpawns(){
  const w = wave; if (!w || !w.pending) return;
  ctx.save(); ctx.strokeStyle=INK; ctx.fillStyle=INK;
  for (const s of w.pending){
    const k = clamp(1 - s.t/SPAWN_DELAY, 0, 1), cx = s.tx*T + T/2;
    if (s.fly){   // cổng trên không: vòng xoáy co dần
      const cy = s.ty*T + T/2, r = 26 - k*12;
      ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(cx, cy, r+6, clock*4, clock*4+Math.PI*1.6); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(cx, cy, r*k, 0, Math.PI*2); ctx.fill();
    } else {      // vũng mực trên sàn loang dần, bóng quái hiện lờ mờ
      const fy = (s.ty+1)*T;
      ctx.beginPath(); ctx.ellipse(cx, fy-2, 8 + k*26, 2 + k*4, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = .15 + k*.35; ctx.setLineDash([3,3]); ctx.lineWidth = 1.5;
      ctx.strokeRect(cx-16, fy - 6 - k*24, 32, k*24); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // dấu cảnh báo + vòng đếm ngược
    const ty = (s.fly ? s.ty*T : (s.ty+1)*T - 40) - 14;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, ty, 9, -Math.PI/2, -Math.PI/2 + Math.PI*2*k); ctx.stroke();
    ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', cx, ty+4);
  }
  ctx.restore();
}
function updateCombat(dt){
  const p = player;
  updateWave(dt);
  p.invT -= dt; hurtFlash -= dt;
  // ngắm & ném: giữ F để nạp lực, thả để ném
  p.throwT = Math.max(0, (p.throwT||0) - dt);
  if (inp.throw && state==='play' && !itemGet && !forgeSeq){ if (!p.charging) SFX.play('grab'); p.charging = true; p.charge = Math.min(1, p.charge + dt/.8); }
  else if (p.charging){ p.charging = false; p.throwT = THROW_T; p.throwCh = p.charge; p.throwPend = true; p.charge = 0; SFX.play('swoosh'); }
  if (p.throwPend && p.throwT < THROW_T*.55){ p.throwPend = false; throwFlask(p.throwCh); }
  // lọ đang bay
  for (const f of flasks){
    (f.tr ||= []).push([f.x, f.y]); if (f.tr.length > 9) f.tr.shift();
    f.vy += FLASK_G*dt; f.vx += windAt(f.x, f.y)*420*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += dt*(8 + Math.hypot(f.vx,f.vy)*.012)*Math.sign(f.vx||1);
    if (f.kind==='h2so4' && Math.random() < dt*30) bubbles.push({x:f.x+(Math.random()-.5)*6, y:f.y-6, vy:-30-Math.random()*30, r:1.5+Math.random()*2, life:.5});
    if (f.y > RH || solid(Math.floor(f.x/T), Math.floor(f.y/T)) || 'xw'.includes(tileAt(f.x,f.y)) || hitsEnemy(f.x,f.y)){ f.dead = true; splash(f.x, f.y, f.kind); }
  }
  flasks = flasks.filter(f=>!f.dead);
  // quái
  ENEMY_LOOK = {x:p.x+11, y:p.y+17};
  for (const d of decals) d.life -= dt; decals = decals.filter(d=>d.life>0);
  for (const e of enemies){
    if (e.dead) continue;
    e.t += dt; e.hurtT -= dt; e.knock = (e.knock||0) - dt; updateEnemyAnim(e, dt);
    const ex = e.x+e.w/2, ey = e.y+e.h/2, dx = p.x+11-ex, dist = Math.hypot(dx, p.y+17-ey);
    if (e.type==='jelly'){ // sứa hydro: nổi nhờ lực đẩy Archimedes, trôi chậm về phía Bấc
      e.vx += (Math.sign(dx)*ENEMY.jelly.speed*(dist<320?1:0) - e.vx)*Math.min(1,dt*1.2);
      e.vy = Math.sin(e.t*1.6)*22 + (e.y > e.home.y ? -18 : 6);
      e.x += e.vx*dt; e.y += e.vy*dt; e.dir = Math.sign(e.vx)||1;
      for (const k of litLamps){ const [lx,ly] = k.split(',').map(Number); if (Math.hypot(lx*T+T/2-ex, ly*T-ey) < LIGHT_R*.75){ explodeJelly(e); break; } }
      if (e.dead) continue;
    } else if (e.type==='spitter'){ // tháp phun axit: bắn cung parabol về phía Bấc
      e.dir = Math.sign(dx)||1; e.vy = Math.min(FALL_MAX, e.vy + G*dt); entMove(e, 0, e.vy*dt);
      if (dist < 420 && e.t > 2.4){
        e.t = 0; const sx = ex, sy = e.y+4, t = .95, g = 900;
        blobs.push({x:sx, y:sy, vx:(p.x+11-sx)/t, vy:(p.y+17-sy-.5*g*t*t)/t, g, r:6, acid:true}); SFX.play('blob'); e.shot = 1;
      }
      e.tell = dist < 420 && e.t > 1.95;
    } else if (e.fly){ // bóng mực: bay lượn, đuổi theo, xuyên tường
      const sp = ENEMY.shade.speed * (dist < 300 ? 1 : .3);
      e.vx += (Math.sign(dx)*sp - e.vx)*Math.min(1,dt*2); e.vy = Math.sin(e.t*2.4)*40 + Math.sign(p.y+10-ey)*sp*.5*(dist<300?1:0);
      e.x += e.vx*dt; e.y += e.vy*dt; e.dir = Math.sign(e.vx)||1;
      // ánh sáng đèn dầu làm tan bóng mực
      for (const k of litLamps){ const [lx,ly] = k.split(',').map(Number); if (Math.hypot(lx*T+T/2-ex, ly*T-ey) < LIGHT_R){ e.burn = (e.burn||0) + dt; e.vx -= Math.sign(lx*T+T/2-ex)*300*dt; } }
      if (e.burn > .45){ killEnemy(e, 'ánh sáng xua tan bóng mực'); continue; }
    } else {
      e.vy = Math.min(FALL_MAX, e.vy + G*dt);
      if (e.knock <= 0){
        const D = ENEMY[e.type];
        if (e.type==='slime' && e.ground && dist < 180 && e.t > 1.1){ e.t = 0; e.dir = Math.sign(dx)||1; e.vy = -430; e.vx = e.dir*150; SFX.play('squish'); }
        else if ((e.type==='limestone'||e.type==='iron') && e.ground && dist < 210 && e.t > 3){ e.t = 0; e.dir = Math.sign(dx)||1; e.charging = 1; }
        else if (e.type==='slug' && e.ground && dist < 220){ e.dir = Math.sign(dx)||1; }
        e.charging = Math.max(0, (e.charging||0) - dt);
        if (e.ground && !(e.type==='slime' && e.vy<0)){
          const spd = e.charging>0 ? 120 : D.speed;
          // quay đầu khi gặp tường hoặc mép vực
          const ahead = e.dir>0 ? e.x+e.w+2 : e.x-2, below = Math.floor((e.y+e.h+4)/T);
          if (!solid(Math.floor(ahead/T), below) || solid(Math.floor(ahead/T), Math.floor((e.y+e.h/2)/T))) e.dir *= -1;
          e.vx = e.dir*spd;
        }
      } else e.vx *= Math.pow(.2, dt);
      entMove(e, e.vx*dt, e.vy*dt);
      // bị đẩy vào gai / axit / vực → chết (đúng chất vật lý)
      const tl = tileAt(ex, e.y+e.h-4);
      if (tl==='^' || (tl==='x' && e.type!=='slime' && e.type!=='spitter') || e.y > RH){ killEnemy(e, tl==='^' ? 'đẩy vào gai!' : tl==='x' ? 'rơi vào axit' : null); continue; }
    }
    // va chạm với Bấc: giẫm từ trên xuống, lướt, hoặc bị thương
    if (ov(p, e)){
      const fromAbove = p.vy > 60 && (p.y+p.h) - e.y < 16;
      if (fromAbove) stomp(e);
      else if (p.dashT>0){ if (!p.dashHit.has(e)){ p.dashHit.add(e); if (e.type==='jelly') popJelly(e); else if (e.type==='iron') dashImpact(e, false, true); else dashImpact(e, false); } }
      else if (p.invT<=0) hurtPlayer(1, ex);
    }
  }
  enemies = enemies.filter(e=>!e.dead || false);
  updateBoss(dt);
  // cục mực / giọt axit của boss
  for (const b of blobs){
    b.vy += b.g*dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (Math.hypot(b.x-(p.x+11), b.y-(p.y+17)) < b.r+12){ b.dead = true; hurtPlayer(1, b.x); }
    if (b.y > RH || solid(Math.floor(b.x/T), Math.floor(b.y/T))){ b.dead = true; for (let i=0;i<6;i++) parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*160,vy:-Math.random()*160,a:Math.random()*6,va:4,l:3,life:.4}); }
  }
  blobs = blobs.filter(b=>!b.dead);
  // vật rơi: mực (+mana), dầu đèn (+máu)
  for (const d of drops){
    if (!d.fixed){ d.vy = (d.vy||0) + 900*dt; d.y += d.vy*dt; const ty = Math.floor((d.y+8)/T); if (solid(Math.floor(d.x/T), ty)){ d.y = ty*T-8; d.vy = 0; } }
    if (Math.hypot(d.x-(p.x+11), d.y-(p.y+17)) < 24){
      d.dead = true;
      if (d.kind==='oil'){ p.hp = Math.min(HP_MAX, p.hp+1); popups.push({x:d.x, y:d.y-14, text:'+1 dầu đèn', life:1}); SFX.play('heal'); }
      else { mana = Math.min(MANA_MAX, mana+15); popups.push({x:d.x, y:d.y-14, text:'+15 mực', life:1}); SFX.play('orb'); }
    }
  }
  drops = drops.filter(d=>!d.dead);
  for (const r of ripples){ r.r += 180*dt; r.life -= dt; } ripples = ripples.filter(r=>r.life>0);
  for (const b of bubbles){ b.y += b.vy*dt; b.x += Math.sin(b.life*9)*.4; b.life -= dt; } bubbles = bubbles.filter(b=>b.life>0);

function devSpawnAt(col){

function devKey(e){

  if (e.code==='ArrowDown' || e.code==='KeyS'){ step(1); SFX.play('tick'); }
  else if (e.code==='ArrowUp' || e.code==='KeyW'){ step(-1); SFX.play('tick'); }
  else if (e.code==='Enter' || e.code==='Space') devActivate(m.items[m.sel]);   // không dùng E: E là phím tương tác trong game, bấm nhầm sẽ tải lại màn
  else if (e.code==='KeyE'){ closeDev(); }
  else if (e.code==='Escape') closeDev();
}

}

//  CHƯƠNG — toàn bộ nội dung hiện tại là Chương 1 (5 phần = 5 phần tử trong LEVELS)

//  Sang chương mới: đổi CHAPTER, thay STORY.intro/finale, và thêm LEVELS của chương đó.

const CHAPTER = {no:1, title:'Ngọn đèn tắt', next:'Chương 2'};
const LAST_CH = {no:5, title:'Tháp Đồ Thị', next:'Chương 6', partial:true};
// ===================================================================
//  QUÁI VẬT — ngoại hình & hoạt ảnh
//  Quy ước: axit = thân ĐEN bóng · bazơ = thân TRẮNG · đá vôi/sắt = vỏ có vân · bóng/khí = mờ ảo
// ===================================================================
let ENEMY_LOOK = {x:0, y:0};             // điểm mắt quái nhìn theo (Bấc, hoặc mục tiêu trong sổ tay)
let decals = [];                          // vết trên sàn: vũng axit xèo, vệt xà phòng
function lookDir(x, y, max){ const dx = ENEMY_LOOK.x - x, dy = ENEMY_LOOK.y - y, d = Math.hypot(dx,dy)||1; return {x:dx/d*max, y:dy/d*max}; }
function rimFill(fill){ ctx.fillStyle = fill; ctx.fill(); }
function rimPath(lw){ ctx.save(); ctx.strokeStyle = PAPER; ctx.lineWidth = lw||2.4; ctx.globalAlpha *= .9; ctx.stroke(); ctx.restore(); }

// ---------- 1. NHẦY AXIT: giọt axit đen bóng, sủi bọt, nhỏ giọt ----------
function drawSlime(e, hit){
  // Nhầy Axit: khối nguyên sinh chất ăn mòn — viền méo động, nhân-mắt bên trong, xương con mồi đang tan dở
  const ex = e.x+e.w/2, by = e.y+e.h, d = e.dir||1;
  let sx = 1, sy = 1;
  if (!e.ground){ sx = .82; sy = 1.25; }
  else if (e.crouch > 0){ sx = 1 + .3*e.crouch; sy = 1 - .32*e.crouch; }
  if (e.land > 0){ sx += .35*e.land; sy -= .28*e.land; }
  const W = 17*sx, H = 25*sy, B = hit ? PAPER : INK, F = hit ? INK : PAPER, t = e.t;
  const L = lookDir(ex, by-H*.5, 1);
  ctx.save(); ctx.translate(ex, by);
  if (e.ground){ ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, -.5, W*1.35, 2.2, 0, 0, Math.PI*2); ctx.fill(); }
  // viền: đường cong kín với nhiều thuỳ chuyển động lệch pha, thuỳ phía Bấc vươn ra (giả túc)
  const N = 22, pts = [];
  for (let i=0;i<N;i++){
    const a = Math.PI + i/(N-1)*Math.PI; // nửa trên từ trái qua phải
    let r = 1 + .07*Math.sin(a*3 + t*2.3) + .05*Math.sin(a*5 - t*3.1);
    const toward = Math.cos(a)*L.x; if (toward > 0) r += toward*.12*(1 + (e.crouch||0));
    pts.push([Math.cos(a)*W*r*1.1, Math.sin(a)*H*r]);
  }
  ctx.beginPath(); ctx.moveTo(-W*1.25, 0);
  ctx.lineTo(pts[0][0], pts[0][1]*.2);
  for (let i=1;i<N;i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i]; ctx.quadraticCurveTo(x0, y0, (x0+x1)/2, (y0+y1)/2); }
  ctx.lineTo(W*1.25, 0); ctx.closePath();
  const outline = new Path2D(); // lưu lại để clip
  if (hit){ ctx.fillStyle=B; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke(); } else { rimPath(2.6); ctx.fillStyle=B; ctx.fill(); }
  ctx.save(); ctx.clip();
  // lớp màng: vòng đồng tâm mờ theo hình dạng
  ctx.strokeStyle = F; ctx.lineWidth = .8; ctx.globalAlpha = .22;
  for (const k of [.78,.56]){ ctx.beginPath(); ctx.ellipse(0, -H*.08, W*1.1*k, H*k, 0, Math.PI, Math.PI*2); ctx.stroke(); }
  // xương con mồi tan dở (xương sườn + đốt sống), trôi chậm
  ctx.globalAlpha = .55; ctx.save(); ctx.translate(-W*.35 + Math.sin(t*.7)*1.5, -H*.28 + Math.cos(t*.9)*1.2); ctx.rotate(-.5 + Math.sin(t*.5)*.1);
  // sọ chuột nhỏ: hộp sọ + hốc mắt + hàm, mép đã bị ăn mòn
  ctx.fillStyle = F; ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 3.4, 0, 0, Math.PI*2); ctx.moveTo(2.5, 1); ctx.quadraticCurveTo(6.5, 1.5, 6.8, 3); ctx.lineTo(2, 3.2); ctx.fill();
  ctx.fillStyle = B; ctx.beginPath(); ctx.arc(1.6, -.2, 1.2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-2.6, -1.5, .8, 0, Math.PI*2); ctx.arc(-1.2, 2, .6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = F; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(-1, 3.6); ctx.quadraticCurveTo(2.5, 6, 6, 4.4); ctx.stroke();
  ctx.restore();
  // bọt khí nhỏ li ti bốc lên
  ctx.lineWidth = .8;
  for (let i=0;i<6;i++){ const ph = (t*.55 + i*.17)%1; ctx.globalAlpha = .7*(1-ph); ctx.beginPath(); ctx.arc(-W*.7 + i*W*.3 + Math.sin(t*2+i)*1.5, -1 - ph*H*.9, .6 + (i%3)*.35, 0, Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // nhân-mắt: màng trắng, đồng tử dọc dạng khe, co lại khi chuẩn bị nhảy
  const nx = W*.12 + L.x*3, ny = -H*.52 + L.y*2;
  ctx.fillStyle = F; ctx.beginPath(); ctx.ellipse(nx, ny, 4.6, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = B; const slit = 1.6 - (e.crouch||0)*1;
  ctx.beginPath(); ctx.ellipse(nx + L.x*1.4, ny + L.y, Math.max(.5, slit), 3.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = F; ctx.lineWidth = .7; ctx.globalAlpha = .4; ctx.beginPath(); ctx.arc(nx, ny, 6.8, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
  // vệt sáng ướt (ánh phản chiếu dài, mảnh)
  ctx.restore();
  ctx.strokeStyle = F; ctx.lineCap = 'round'; ctx.lineWidth = 1.6; ctx.globalAlpha = .85;
  ctx.beginPath(); ctx.ellipse(0, -H*.1, W*.85, H*.78, 0, Math.PI*1.18, Math.PI*1.36); ctx.stroke();
  ctx.lineWidth = 1.1; ctx.beginPath(); ctx.ellipse(0, -H*.1, W*.85, H*.78, 0, Math.PI*1.42, Math.PI*1.47); ctx.stroke();
  ctx.globalAlpha = 1;
  // dây nhầy + giọt rơi ở mép
  ctx.fillStyle = B; ctx.strokeStyle = B; ctx.lineWidth = 1.4;
  for (const [s2,k] of [[-1,0],[1,.55]]){ const ph = (t*.9 + k) % 1, x = s2*W*1.02, len = 2 + ph*6;
    ctx.beginPath(); ctx.moveTo(x, -H*.25); ctx.lineTo(x + s2*.6, -H*.25 + len); ctx.stroke();
    if (ph > .6){ ctx.beginPath(); ctx.ellipse(x + s2*.6, -H*.25 + len + 2 + (ph-.6)*12, 1.3, 1.9, 0, 0, Math.PI*2); ctx.fill(); } }
  ctx.restore();
}

// ---------- 2. GIÁP ĐÁ VÔI: bọ giáp mảnh CaCO₃, 6 chân, càng kẹp ----------
function drawLimestone(e, hit){
  const ex = e.x+e.w/2, by = e.y+e.h, d = e.dir||1, chg = e.charging>0;
  ctx.save(); ctx.translate(ex, by); ctx.scale(d,1);
  if (chg) ctx.rotate(.05);
  // 6 chân có khớp, dáng đi kiềng ba chân (3 chân sau mờ hơn)
  const ph = (e.walk||0)*.32;
  for (const back of [1,0]){
    ctx.strokeStyle = INK; ctx.globalAlpha = back ? .5 : 1; ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    for (let i=0;i<3;i++){ const hx = -12 + i*11, p = ph + i*2.1 + back*Math.PI, fx = hx + Math.sin(p)*5 - 2, lift = Math.max(0, Math.cos(p))*4;
      ctx.beginPath(); ctx.moveTo(hx, -8); ctx.lineTo(hx + (fx-hx)*.5 - 3, -14 - lift*.5); ctx.lineTo(fx, -lift); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // đầu + càng kẹp + râu
  const hy = chg ? -8 : -11, open = .25 + Math.max(0, Math.sin(e.t*(chg?14:3)))*.35;
  ctx.beginPath(); ctx.ellipse(19, hy, 6.5, 5.5, 0, 0, Math.PI*2); rimPath(2.4); ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (const s2 of [-1,1]){ ctx.beginPath(); ctx.moveTo(23, hy+s2*1.5); ctx.quadraticCurveTo(30, hy+s2*(3+open*5), 32, hy+s2*open*2); ctx.stroke(); }
  ctx.lineWidth = 1.2; for (const k of [0,1]){ const w = Math.sin(e.t*3+k)*3; ctx.beginPath(); ctx.moveTo(20, hy-4); ctx.quadraticCurveTo(25+k*3, hy-14, 31+k*4+w, hy-13+w*.5); ctx.stroke(); }
  const L = lookDir(ex + 21*d, by + hy, 1); ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(21 + L.x*d, hy-1 + L.y, 1.7, 0, Math.PI*2); ctx.fill();
  // thân dưới mềm
  ctx.beginPath(); ctx.ellipse(0, -11, 19, 9, 0, 0, Math.PI*2); rimPath(3); ctx.fillStyle = hit?PAPER:INK; ctx.fill();
  if (e.armor < 2){ ctx.strokeStyle = hit?INK:PAPER; ctx.lineWidth = 1; ctx.globalAlpha = .5 + .4*Math.sin(e.t*8);
    ctx.beginPath(); ctx.moveTo(-14,-12); ctx.quadraticCurveTo(-5,-19,4,-13); ctx.quadraticCurveTo(10,-8,16,-14); ctx.stroke(); ctx.globalAlpha = 1; }
  // mai đá vôi: một vòm liền, chia 4 đốt cong (kiểu rệp gỗ), vân rỗ; trúng axit → đốt giữa vỡ mất
  if (e.armor > 0){
    const R = 21, H = 19, cy = -9, F = hit ? INK : PAPER, K = hit ? PAPER : INK;
    const dome = ()=>{ ctx.beginPath(); ctx.moveTo(-R, cy); ctx.bezierCurveTo(-R, cy-H*1.3, R, cy-H*1.3, R, cy); ctx.closePath(); };
    dome(); ctx.fillStyle = F; ctx.fill();
    ctx.save(); dome(); ctx.clip();
    // đường ranh các đốt: cong theo vòm
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
    const xs = [-10.5, 0, 10.5];
    for (const x of xs){ ctx.beginPath(); ctx.moveTo(x*1.15, cy+1); ctx.quadraticCurveTo(x*.9, cy-H*.6, x*.55, cy-H*1.2); ctx.stroke(); }
    // vân rỗ + gờ ngang mỗi đốt
    ctx.fillStyle = K; const pits = [[-15,-4],[-13,-11],[-6,-6],[-4,-14],[4,-9],[6,-15],[13,-5],[15,-12],[-9,-17],[9,-3]];

// ---------- 3. BÓNG MỰC: hồn ma trùm mũ, đuôi xé tua, một mắt lớn ----------
function drawShade(e, hit){
  const ex = e.x+e.w/2, ey = e.y+e.h/2, burn = e.burn||0;

  ctx.quadraticCurveTo(13,-15,12,-1);

  for (let k=0;k<=n;k++){ const t = k/n, x = 12 - t*24 + back*t*t*10, y = 6 + (k%2 ? 10 + Math.sin(e.t*8+k)*3 : 2) + t*4*Math.abs(back); ctx.lineTo(x, y); }

  // dải khói bay ngược phía sau

// ---------- 4. SÊN KIỀM: thân trắng trơn như xà phòng, tinh thể NaOH trên lưng ----------

  ctx.scale(d,1); ctx.fillStyle=INK; ctx.font=`700 8px ${FONT}`; ctx.textAlign='center'; ctx.globalAlpha=.6; ctx.fillText('pH 12', 0, -28);

// ---------- 5. THÁP PHUN AXIT: cây nắp ấm đen, túi axit phập phồng, miệng ngắm theo Bấc ----------

// ---------- 6. SỨA HYDRO: chuông trong suốt co bóp, bọt H₂ bên trong, xúc tu chuỗi hạt ----------

  ctx.restore();

// ---------- 7. RÙA SẮT: mai thép ghép tấm lục giác, đinh tán, khe mắt phát sáng ----------

  ctx.scale(d,1); ctx.fillStyle=INK; ctx.font=`700 9px ${FONT}`; ctx.textAlign='center'; ctx.globalAlpha=.7; ctx.fillText('Fe', 0, -46);
  ctx.restore();

const ENEMY_DRAW = {slime:drawSlime, limestone:drawLimestone, shade:drawShade, slug:drawSlug, spitter:drawSpitter, jelly:drawJelly, iron:drawIron};
function drawEnemy(e){

      if (Math.sin(clock*12 + d.x) > .7){ ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(d.x+(d.x%5)-2, d.y-4, 1.2, 0, Math.PI*2); ctx.stroke(); } }
    else if (d.type==='soap'){ ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(d.x, d.y-2.5, d.r, 0, Math.PI*2); ctx.stroke(); }
    else if (d.type==='dust'){ ctx.fillStyle=INK; ctx.globalAlpha = a*.25; ctx.beginPath(); ctx.ellipse(d.x, d.y-2, d.r*(2-a), 2, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}
function updateEnemyAnim(e, dt){
  e.land = Math.max(0, (e.land||0) - dt*4);
  if (!e.fly){ if (e.ground && e.wasG === false) e.land = 1; e.wasG = e.ground; }
  e.walk = (e.walk||0) + Math.abs(e.vx||0)*dt;
  e.shot = Math.max(0, (e.shot||0) - dt*3);
  const ex = e.x+e.w/2, fy = e.y+e.h;
  e.crouch = 0;
  if (e.type==='slime' && e.ground){ const dist = Math.hypot(ENEMY_LOOK.x-ex, ENEMY_LOOK.y-(e.y+e.h/2)); if (dist < 180 && e.t > .8) e.crouch = Math.min(1, (e.t-.8)/.3); }
  e.dropT = (e.dropT||0) - dt;
  if (e.dropT <= 0 && e.ground){
    if (e.type==='slime'){ decals.push({x:ex+(Math.random()-.5)*14, y:fy, r:2.5+Math.random()*2, life:2.2, type:'acid'}); e.dropT = .5; }
    else if (e.type==='slug' && Math.abs(e.vx)>5){ decals.push({x:ex - (e.dir||1)*14, y:fy, r:1.5+Math.random()*2, life:2.5, type:'soap'}); e.dropT = .14; }
    else if ((e.type==='iron' || e.type==='limestone') && e.charging>0){ decals.push({x:ex - (e.dir||1)*18, y:fy, r:6, life:.6, type:'dust'}); e.dropT = .12; }
  }
}

  {type:'iron',      name:'Rùa Sắt',        sci:'mai Fe · m lớn, khó đẩy',        weak:'giẫm từ ≥ 4 ô (E = mgh)'},
];
let bestiary = null;
function openBestiary(){
  closeDev();
  bestiary = {t:0, list: BESTIARY.map(b=>{ const D = ENEMY[b.type]; return {...b, e:{type:b.type, x:0, y:0, w:D.w, h:D.h, vx:0, vy:0, hp:D.hp, armor:D.armor||0, dir:1, t:Math.random()*3, ground:!D.fly, fly:!!D.fly, hurtT:0, walk:0}}; })};
}
function updateBestiary(dt){
  const B = bestiary; B.t += dt;
  B.list.forEach((it,i)=>{ const e = it.e; e.t += dt; e.vx = 40*Math.sin(B.t*.7 + i); e.dir = e.vx>=0 ? 1 : -1; e.walk += Math.abs(e.vx)*dt;
    const ph = (B.t + i*1.3) % 6;
    e.charging = (e.type==='limestone'||e.type==='iron') && ph > 3 && ph < 4 ? 1 : 0;
    e.tell = e.type==='spitter' && ph > 2 && ph < 2.5; if (e.type==='spitter' && ph >= 2.5 && ph < 2.55) e.shot = 1;
    e.shot = Math.max(0, (e.shot||0) - dt*3);
    e.crouch = e.type==='slime' && ph > 4.5 && ph < 5 ? (ph-4.5)/.5 : 0; e.ground = e.fly ? false : !(e.type==='slime' && ph >= 5 && ph < 5.6);
    e.land = e.type==='slime' && ph >= 5.6 && ph < 5.9 ? 1-(ph-5.6)/.3 : 0;
    e.hurtT = ph > 1 && ph < 1.25 ? .1 : 0;
    if (e.type==='iron') e.hp = ph > 4.6 ? 1 : 2;
    if (e.type==='limestone') e.armor = ph < 2 ? 2 : ph < 4 ? 1 : 0;
    e.burn = e.type==='shade' && ph > 5.2 ? (ph-5.2) : 0; });
}
function drawBestiary(){
  const B = bestiary; if (!B) return;
  const W = innerWidth, H = innerHeight;
  ctx.save(); ctx.fillStyle = WALL; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = INK; ctx.font = `400 ${Math.min(34, W/18)}px ${HAND}`; ctx.textAlign='center'; ctx.fillText('Sổ tay quái vật · Thế giới Sa Ngã', W/2, 44);
  ctx.font = `400 11px ${FONT}`; ctx.globalAlpha=.6; ctx.fillText('Esc / Enter / chạm để đóng', W/2, 64); ctx.globalAlpha=1;
  const cols = W > 820 ? 4 : W > 520 ? 3 : 2, gap = 12, cw = Math.min(220, (W - 32 - gap*(cols-1))/cols), ch = 168;
  const rows = Math.ceil(B.list.length/cols), x0 = (W - (cols*cw + (cols-1)*gap))/2, y0 = Math.max(80, (H - (rows*ch + (rows-1)*gap))/2 + 20);
  B.list.forEach((it, i)=>{
    const cx = x0 + (i%cols)*(cw+gap), cy = y0 + Math.floor(i/cols)*(ch+gap);
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillRect(cx, cy, cw, ch); ctx.strokeRect(cx, cy, cw, ch);
    ctx.lineWidth = 1; ctx.globalAlpha=.25; line(cx+12, cy+104, cx+cw-12, cy+104); ctx.globalAlpha=1;
    const e = it.e, k = 1.7, bx = cx + cw/2, by = cy + 100;
    ENEMY_LOOK = {x: Math.sin(B.t*.9 + i)*50, y: -30 + Math.cos(B.t*.7)*20};
    ctx.save(); ctx.beginPath(); ctx.rect(cx+2, cy+2, cw-4, 102); ctx.clip();
    ctx.translate(bx, by); ctx.scale(k, k);
    e.x = -e.w/2; e.y = e.fly ? -e.h - 18 + Math.sin(B.t*2+i)*3 : -e.h;
    if (!e.fly){ ctx.globalAlpha=.2; ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0, -1, e.w*.65, 3, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    drawEnemy(e);
    ctx.restore();
    ctx.fillStyle = INK; ctx.textAlign='left';
    ctx.font = `400 20px ${HAND}`; ctx.fillText(it.name, cx+12, cy+126);
    ctx.font = `400 10px ${FONT}`; ctx.globalAlpha=.75; ctx.fillText(it.sci, cx+12, cy+142, cw-20); ctx.globalAlpha=1;
    ctx.font = `700 10px ${FONT}`; ctx.fillText('↯ ' + it.weak, cx+12, cy+158, cw-20);
  });
  ctx.restore();
}

    if (ov(e, r) && e.y+e.h - r.y < 14){ e.y = r.y - e.h; e.vy = Math.min(e.vy, 0); e.ground = true; }
  pulley.spin = (pulley.spin||0) + dd*.05;

// ----- Hoá học: trung hoà axit -----
function neutralize(sx, sy){
  SFX.play('fizz');
  const q=[[sx,sy]], seen=new Set(); let n=0, cxs=0, cys=0;
  while (q.length){ const [x,y]=q.pop(), k=x+','+y; if (seen.has(k)) continue; seen.add(k);
    if (x<0||y<0||x>=GW||y>=GH||grid[y][x]!=='x') continue;
    grid[y][x]='w'; n++; cxs+=x; cys+=y; q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  tiles.w = (tiles.w||[]).concat((tiles.x||[]).filter(t=>grid[t.y][t.x]==='w'));
  tiles.x = (tiles.x||[]).filter(t=>grid[t.y][t.x]==='x');
  const mx=(cxs/n+.5)*T, my=(cys/n)*T;
  popups.push({x:mx, y:my-20, text:'HCl + NaOH → NaCl + H₂O', life:3.5, big:true});
  for (let i=0;i<40;i++) parts.push({x:mx+(Math.random()-.5)*n*8,y:my,vx:(Math.random()-.5)*200,vy:-Math.random()*380,a:Math.random()*6,va:(Math.random()-.5)*10,l:3+Math.random()*4,life:.9});
}
function computeSteam(){
  steamCols = [];
  for (const t of tiles.h||[]){
    const above = grid[t.y-1] && grid[t.y-1][t.x];
    if (above!=='w' && above!=='x') continue;
    let top = t.y-1; while (top>0 && !solid(t.x, top-1)) top--;
    steamCols.push({x:t.x*T, top:top*T, bottom:t.y*T, acid: above==='x'});
  }
}

function updateMirrorHold(dt){

    const d = inp.left ? -1 : 1, k = mirrorNear; mirrorAng[k] += d*MIRROR_SPEED*dt;
    mirrorTick += Math.abs(MIRROR_SPEED*dt); if (mirrorTick > .087){ mirrorTick = 0; SFX.play('tick'); }

  if (inp.down && p.ground && onShelf(p)){ p.dropT = .22; p.y += 2; p.ground = false; p.coy = 0; }
  // Cúi xuống (giữ ↓/S): thân thấp còn 22px, đi chậm; đứng dậy chỉ khi trên đầu còn chỗ

  for (const t of tiles['^']||[]) if (ov(p,{x:t.x*T+5,y:t.y*T+T*.55,w:T-10,h:T*.45})) return die();
  for (const s of saws){ const nx=clamp(s.x,p.x,p.x+p.w), ny=clamp(s.y,p.y,p.y+p.h); if (Math.hypot(s.x-nx,s.y-ny)<15) return die(); }
  // Con lắc: θ(t) = θ₀·cos(ωt + φ), ω = √(g/L)
  for (const q of pendulums){
    q.th = q.th0*Math.cos(q.w*clock + q.ph); const bx = q.ax + Math.sin(q.th)*q.L, by = q.ay + Math.cos(q.th)*q.L; q.bx = bx; q.by = by;
    if (Math.abs(q.th) < .12 && !q.passed){ q.passed = true; if (Math.abs(bx-(p.x+11)) < 360) SFX.play('swoosh'); } else if (Math.abs(q.th) > .3) q.passed = false;
    const nx=clamp(bx,p.x,p.x+p.w), ny=clamp(by,p.y,p.y+p.h);
    if (Math.hypot(bx-nx, by-ny) < 17){ if (LEVELS[lvl].combat) hurtPlayer(1, bx); else return die(); }
  }
  // Băng chuyền: ma sát kéo theo vật đứng trên
  { const under = p.ground ? tileAt(p.x+11, p.y+p.h+2) : '.'; const bv = under==='c' ? -BELT : under==='C' ? BELT : 0;
    if (bv && p.dashT<=0) moveX(p, bv*dt); SFX.loop('belt', bv ? 1 : 0); SFX.loop('gale', Math.min(1, Math.abs(p.windW||0)));
    // rời băng chuyền vẫn mang theo vận tốc của nó (quán tính), mất dần khi đáp đất
    if (p.ground) p.beltV = bv; else if (p.beltV){ moveX(p, p.beltV*dt); p.beltV *= Math.max(0, 1 - .4*dt); }
    for (const bx of boxes){ const u = tileAt(bx.x+T/2, bx.y+T+2); if (u==='c'||u==='C') moveX(bx, (u==='c'?-BELT:BELT)*dt); } }
  if (tileAt(p.x+4, p.y+p.h-6)==='x' || tileAt(p.x+p.w-4, p.y+p.h-6)==='x'){ popups.push({x:cx, y:p.y-10, text:'axit!', life:1.2}); SFX.play('sizzle'); return die(); }
  // sổ tay khoa học: hiện khi vào đoạn mới
  if (LEVELS[lvl].notes && curSeg !== noteSeg){ noteSeg = curSeg; noteT = 9; }
  noteT -= dt;
  if (p.y > RH) return die();
  // Lối ra
  if (!(boss && !boss.dead)) for (const t of tiles.E||[]) if (cx>t.x*T+8 && cx<t.x*T+T-8 && cy>t.y*T-T && cy<t.y*T+T) return win();
}

function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
const hash2 = (a,b) => { const v = Math.sin(a*127.1 + b*311.7)*43758.5453; return v - Math.floor(v); };
function updateAmbience(dt){
  if (!motes.length) for (let i=0;i<45;i++) motes.push({x:Math.random()*2000, y:Math.random()*600, s:Math.random(), ph:Math.random()*6});
  for (const m of motes){ m.ph += dt*(.4+m.s*.6); m.x += Math.sin(m.ph)*6*dt + 4*dt; m.y += Math.cos(m.ph*.7)*5*dt - 2*dt; }
  for (const k in lampOff) lampOff[k] -= dt;
  if (Math.random() < dt*.25){ const lamps = LEVELS[lvl].decor.filter(d=>d[0]==='lamp'); if (lamps.length){ const L = lamps[Math.floor(Math.random()*lamps.length)]; lampOff[L[1]] = .06 + Math.random()*.12; } }
}

function drawMotes(){

    const x = ((m.x - camX*.8) % viewW + viewW) % viewW, y = ((m.y - camY*.8) % viewH + viewH) % viewH;

// Tiền cảnh: vật treo ở gần ống kính, trôi nhanh hơn (thị sai > 1), làm cảnh có chiều sâu
function drawForeground(){
  const th = LEVELS[lvl].theme, f = 1.3, ox = camX*f;
  ctx.save(); ctx.strokeStyle=INK; ctx.fillStyle=INK;
  const sp = 620, s0 = Math.floor(ox/sp)-1;
  for (let i=s0; i*sp-ox < viewW+sp; i++){
    if (hash2(i,3) < .35) continue;
    const x = i*sp - ox + hash2(i,5)*200, len = 50 + hash2(i,9)*90, sw = Math.sin(clock*1.2+i)*.05;
    ctx.save(); ctx.translate(x, -4); ctx.rotate(sw);
    if (th==='outside'){ ctx.restore(); continue; }
    if (th==='fallen'){              // xúc tu mực rủ xuống
      ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(0,0); for (let k=1;k<=8;k++) ctx.lineTo(Math.sin(clock*1.4+i+k*.6)*8*k/8, k*len/8); ctx.stroke();
      ctx.beginPath(); ctx.arc(Math.sin(clock*1.4+i+4.8)*8, len+4, 4, 0, Math.PI*2); ctx.fill();
    } else if (th==='basement'){            // xích sắt
      ctx.lineWidth=3; for (let k=0;k<len/10;k++){ ctx.beginPath(); ctx.ellipse(0, k*10+5, k%2?2:4, 6, 0, 0, Math.PI*2); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0,len+10,7,0,Math.PI); ctx.stroke();
    } else if (th==='lab'){          // dây cáp + kẹp
      ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(30,len,70,len*.6); ctx.stroke();
      ctx.fillRect(66, len*.6-8, 14, 16);
    } else {                          // chậu cây treo
      ctx.lineWidth=1.5; line(0,0,-10,len); line(0,0,10,len);
      ctx.beginPath(); ctx.moveTo(-16,len); ctx.lineTo(16,len); ctx.lineTo(11,len+18); ctx.lineTo(-11,len+18); ctx.closePath(); ctx.fill();
      ctx.lineWidth=2.5; for (let k=0;k<5;k++){ const a=-1.2+k*.6; ctx.beginPath(); ctx.moveTo(0,len); ctx.quadraticCurveTo(Math.sin(a)*20, len-10, Math.sin(a)*26, len+12+k%2*8+Math.sin(clock*1.5+k)*2); ctx.stroke(); }
    }
    ctx.restore();
  }
  // viền tối quanh khung nhìn
  // viền tối quanh khung (vignette): vẽ sẵn một lần ra ảnh nhỏ rồi dán, thay vì tô gradient toàn màn mỗi khung
  if (!PERF.low){
    const key = Math.round(viewW)+'x'+Math.round(viewH);
    if (!vigCv || vigCv.key !== key){
      vigCv = document.createElement('canvas'); vigCv.key = key; vigCv.width = Math.ceil(viewW/2); vigCv.height = Math.ceil(viewH/2);
      const v = vigCv.getContext('2d'), w = vigCv.width, h = vigCv.height, r0 = Math.max(0, Math.min(w,h)*.45), r1 = Math.max(r0+1, Math.max(w,h)*.75);
      const g = v.createRadialGradient(w/2, h/2, r0, w/2, h/2, r1); g.addColorStop(0,'rgba(17,17,17,0)'); g.addColorStop(1,'rgba(17,17,17,.16)');
      v.fillStyle = g; v.fillRect(0,0,w,h);
    }
    ctx.drawImage(vigCv, 0, 0, viewW, viewH);
  }
  ctx.restore();
}

// Vùng sáng dưới mỗi đèn: tường sáng dần về tâm (light falloff)
function drawLanternLight(){
  for (const k of litLamps){
    const [lx,ly] = k.split(',').map(Number), cx = lx*T+T/2, cy = ly*T;
    if (Math.abs(cx-(camX+viewW/2)) > viewW/2+LIGHT_R) continue;
    const g = ctx.createRadialGradient(cx, cy, 8, cx, cy, LIGHT_R);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.6,'rgba(255,255,255,.5)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx, cy, LIGHT_R, 0, Math.PI*2); ctx.fill();
  }
}
function drawLightPools(L){
  drawLanternLight();
  for (const d of L.decor){
    if (d[0]!=='lamp' || lampOff[d[1]] > 0) continue;
    const cx = d[1]*T+T/2; if (Math.abs(cx-(camX+viewW/2)) > viewW/2+260) continue;
    const g = ctx.createRadialGradient(cx, T+150, 10, cx, T+170, 230);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.55, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(cx-240, T, 480, 420);
  }
}
// Bóng tối nhẹ ở góc giao giữa không gian trống và khối đặc (ambient occlusion)
function drawAO(x0,x1,y0,y1){
  ctx.save(); ctx.fillStyle = INK;
  const open = (x,y) => x>=0 && y>=0 && x<GW && y<GH && !solid(x,y);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    if (!open(x,y)) continue;
    const X=x*T, Y=y*T;
    for (let k=0;k<3;k++){
      const d = 4+k*5; ctx.globalAlpha = .035;
      if (!open(x,y+1)) ctx.fillRect(X, Y+T-d, T, d);
      if (!open(x,y-1)) ctx.fillRect(X, Y, T, d);
      if (!open(x-1,y)) ctx.fillRect(X, Y, d, T);
      if (!open(x+1,y)) ctx.fillRect(X+T-d, Y, d, T);
    }
  }
  ctx.restore();
}
// Bóng tiếp xúc: elip mờ trên mặt sàn ngay dưới vật, nhỏ và nhạt dần khi vật ở cao
function contactShadow(e, k){
  const cx = e.x+e.w/2, tx = Math.floor(cx/T); let fy = null;
  for (let ty=Math.floor((e.y+e.h-1)/T); ty<Math.min(GH, Math.floor((e.y+e.h)/T)+8); ty++){
    if (ty>=0 && solid(tx,ty)){ fy = ty*T; break; }
  }
  if (pulley) for (const r of pulleyRects()) if (cx>r.x && cx<r.x+r.w && r.y>=e.y+e.h-2 && (fy===null || r.y<fy)) fy = r.y;
  for (const b of boxes) if (b!==e && cx>b.x && cx<b.x+b.w && b.y>=e.y+e.h-2 && (fy===null || b.y<fy)) fy = b.y;
  if (fy===null) return;
  const dist = Math.max(0, fy-(e.y+e.h)), f = 1 - Math.min(1, dist/220);
  if (f<=0) return;
  ctx.save(); ctx.globalAlpha = .28*f*k; ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(cx, fy-1, (e.w*.62+4)*(.55+.45*f), 3.2*(.6+.4*f), 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
// Gợi ý tương tác: phím E nổi trên cần gạt / van khi đứng gần
function drawPrompts(){
  const px = player.x+11, py = player.y+17;
  for (const c of ['l','v','n','F']) for (const t of tiles[c]||[]){
    if (c==='F' && (forgeDone || forgeSeq)) continue;
    if (c==='n' && litLamps.has(t.x+','+t.y)) continue;
    const d = Math.hypot(t.x*T+T/2-px, t.y*T+T/2-py); if (d > 90) continue;
    const a = clamp((90-d)/40, 0, 1), x = t.x*T+T/2, y = t.y*T - 14 + Math.sin(clock*4)*2;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=1.8;
    ctx.fillRect(x-9,y-9,18,18); ctx.strokeRect(x-9,y-9,18,18); ctx.fillRect(x-9,y+9,18,2);
    ctx.fillStyle=INK; ctx.font=`700 11px ${FONT}`; ctx.textAlign='center'; ctx.fillText('E', x, y+4);
    ctx.restore();

// ===== ĐIỆN ẢNH: cảnh truyện quay bằng nhiều góc máy =====
// Mỗi cảnh (shot) = một "phim trường" (set) vẽ trong toạ độ riêng + máy quay {x,y,zoom,xoay} di chuyển từ đầu → cuối shot.
// Góc máy: toàn cảnh, cận, đặc tả, từ trên xuống, từ dưới lên, qua vai, nghiêng (dutch), máy lia/theo/cẩu.
const CINE = {};
const crand = i => { const x = Math.sin(i*127.1+311.7)*43758.5453; return x - Math.floor(x); };
const cl01 = v => Math.max(0, Math.min(1, v));
const smooth = v => { v = cl01(v); return v*v*(3-2*v); };
function bgc(col){ ctx.fillStyle = col; ctx.fillRect(-5000,-4000,10000,8000); }
function glowC(x,y,r,a,col='255,255,255'){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); }
function darkAround(x,y,r0,r1,a){ const g=ctx.createRadialGradient(x,y,r0,x,y,r1); g.addColorStop(0,'rgba(17,17,17,0)'); g.addColorStop(1,`rgba(17,17,17,${a})`); ctx.fillStyle=g; ctx.fillRect(x-5000,y-5000,10000,10000); }
function rotP(o,a,p){ const c=Math.cos(a), s=Math.sin(a); return {x:o.x+p.x*c-p.y*s, y:o.y+p.x*s+p.y*c}; }
// nét chữ viết tay (mô phỏng), trả về vị trí ngòi bút
function scrib(x,y,w,seed,prog=1,lw=1.5){
  if (prog <= 0) return x; const end = x + w*prog, a = lw/1.5;
  ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x,y); let xx = x, i = 0;
  while (xx < end - .5){ const s = Math.min((5+crand(seed+i)*7)*a, end-xx);
    ctx.quadraticCurveTo(xx+s*.5, y-(2+crand(seed+i*3.7)*5)*a, xx+s, y+(crand(seed+i*7.3)-.5)*2*a); xx += s; i++;
    if (crand(seed+i*1.9) > .85 && xx < end-8*a){ xx += 4*a; ctx.moveTo(xx,y); } }

function cineShot(set, a, b, dur, line, o={}){ return {cine:true, set, a, b, dur, line:line||'', o, tr:o.tr||'cut', sfx:o.sfx}; }
function cineCard(text, dur=5, tr='fade'){ return {cine:true, set:'black', a:[0,0,1,0], b:[0,0,1,0], dur, line:text, o:{card:true}, tr}; }
const CINE_CPS = 24, CINE_DARK = new Set(['black','window','fall','wing','stairs','dissolve','page','coast','tank','forge']);
function cineTyped(P){ return story.full ? P.line.length : Math.max(0, Math.floor((story.t - .45)*CINE_CPS)); }
function cineLen(P){ return Math.max(P.dur, .45 + P.line.length/CINE_CPS + (P.o.card ? 2.4 : 2.0)); }
function nextShot(){
  if (!story) return; story.i++; story.t = 0; story.full = false;
  if (story.i >= story.q.length){ skipStory(); return; }
  const P = story.q[story.i]; if (P.sfx) SFX.play(P.sfx); if (!P.cine) SFX.play('turn');
}
function drawCine(P){
  const W = innerWidth, H = innerHeight, ti = story.t;
  ctx.fillStyle = INK; ctx.fillRect(0,0,W,H);
  const fh = Math.min(H*.78, W/1.85), fy = Math.max(8, (H - fh)/2 - Math.min(20, H*.035)), barB = H - fy - fh;
  const k = cl01(ti / P.dur), e = P.o.ease==='lin' ? k : P.o.ease==='out' ? 1-(1-k)*(1-k) : smooth(k);
  const c = P.a.map((v,i)=> v + (P.b[i]-v)*e);
  const whip = P.tr==='whip' && ti < .4 ? Math.pow(1-ti/.4, 3) : 0;
  ctx.save(); ctx.beginPath(); ctx.rect(0,fy,W,fh); ctx.clip();
  const s = fh/540*c[2], sh = (P.o.shake||0);
  ctx.translate(W/2 + (Math.random()-.5)*sh*s + whip*W*.9, fy+fh/2 + (Math.random()-.5)*sh*s); ctx.rotate(c[3]||0); ctx.scale(s,s); ctx.translate(-c[0],-c[1]);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.globalAlpha=1;
  (CINE[P.set] || CINE.black)(P.o, k, ti);
  ctx.restore();
  // hậu kỳ: tối viền, hạt phim, vết xước, chuyển cảnh
  ctx.save(); ctx.beginPath(); ctx.rect(0,fy,W,fh); ctx.clip(); ctx.globalAlpha=1;
  const vg = ctx.createRadialGradient(W/2,fy+fh/2,fh*.42,W/2,fy+fh/2,Math.hypot(W,fh)*.55); vg.addColorStop(0,'rgba(17,17,17,0)'); vg.addColorStop(1,'rgba(17,17,17,.5)'); ctx.fillStyle=vg; ctx.fillRect(0,fy,W,fh);
  const dark = CINE_DARK.has(P.set) || (P.set==='house' && !P.o.day);
  ctx.fillStyle = dark ? 'rgba(255,255,255,.07)' : 'rgba(17,17,17,.08)'; for (let i=0;i<110;i++) ctx.fillRect(Math.random()*W, fy+Math.random()*fh, 1.6, 1.6);
  if (Math.random() < .05){ ctx.fillStyle = dark ? 'rgba(255,255,255,.12)' : 'rgba(17,17,17,.2)'; ctx.fillRect(Math.random()*W, fy, 1, fh); }
  if (whip > 0){ ctx.fillStyle=`rgba(17,17,17,${whip*.6})`; for (let i=0;i<40;i++){ const y = fy+Math.random()*fh; ctx.fillRect(0, y, W, 1+Math.random()*3); } }
  if (P.tr==='fade' && ti < .9){ ctx.fillStyle=`rgba(17,17,17,${1-ti/.9})`; ctx.fillRect(0,fy,W,fh); }
  if (P.tr==='flash' && ti < .4){ ctx.fillStyle=`rgba(255,255,255,${1-ti/.4})`; ctx.fillRect(0,fy,W,fh); }
  const end = cineLen(P), nx = story.q[story.i+1]; if (nx && nx.tr==='fade' && ti > end - .5){ ctx.fillStyle=`rgba(17,17,17,${cl01((ti-(end-.5))/.5)})`; ctx.fillRect(0,fy,W,fh); }
  ctx.restore();
  // chữ: thẻ chữ giữa khung (card) hoặc phụ đề trong dải đen dưới
  const n = cineTyped(P), txt = P.line.slice(0, n);
  if (P.o.card){
    ctx.font = `400 ${Math.max(22, Math.min(34, W/30))}px ${HAND}`; ctx.fillStyle=PAPER; ctx.textAlign='center';
    const ls = wrapText(txt, Math.min(W*.7, 760)); const lh = Math.max(30, Math.min(44, W/24)); ls.forEach((l,i)=> ctx.fillText(l, W/2, fy+fh/2 - (ls.length-1)*lh/2 + i*lh + 10));
  } else if (txt){
    const fs = Math.max(17, Math.min(24, W/46)); ctx.font = `400 ${fs}px ${HAND}`; ctx.textAlign='center';
    const ls = wrapText(txt, Math.min(W*.84, 900)), lh = fs*1.3, inBar = barB >= ls.length*lh + 18;
    let y0 = inBar ? fy + fh + 12 + fs : fy + fh - ls.length*lh - 6 + fs*.2;
    if (!inBar){ const g = ctx.createLinearGradient(0, fy+fh-ls.length*lh-40, 0, fy+fh); g.addColorStop(0,'rgba(17,17,17,0)'); g.addColorStop(1,'rgba(17,17,17,.85)'); ctx.fillStyle=g; ctx.fillRect(0, fy+fh-ls.length*lh-40, W, ls.length*lh+40); }
    ctx.fillStyle=PAPER; ls.forEach((l,i)=> ctx.fillText(l, W/2, y0 + i*lh));
  }
  ctx.font = `400 11px ${FONT}`; ctx.textAlign='right'; ctx.fillStyle=PAPER; ctx.globalAlpha=.35;
  ctx.fillText('Enter / chạm: tiếp  ·  Esc: bỏ qua', W-12, Math.max(14, fy-6)); ctx.globalAlpha=1;
}

  if (LEVELS[lvl].combat) drawDarkness();
  drawTnt();
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineCap='round';
  for (const p of parts){ ctx.globalAlpha=Math.max(0,p.life); line(p.x-Math.cos(p.a)*p.l/2,p.y-Math.sin(p.a)*p.l/2,p.x+Math.cos(p.a)*p.l/2,p.y+Math.sin(p.a)*p.l/2); }
  for (const u of popups){
    ctx.globalAlpha=Math.min(1,u.life*2); ctx.font=`700 ${u.big?15:11}px ${FONT}`; ctx.textAlign='center';
    if (u.big){ const tw=ctx.measureText(u.text).width+16; ctx.fillStyle=PAPER; ctx.fillRect(u.x-tw/2,u.y-15,tw,22); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(u.x-tw/2,u.y-15,tw,22); }
    ctx.fillStyle=INK; ctx.fillText(u.text,u.x,u.y); }
  ctx.globalAlpha=1;
  ctx.restore();
  if (!PERF.low) { ctx.save(); ctx.beginPath(); ctx.rect(0,0,viewW,viewH); ctx.clip(); drawForeground(); ctx.restore(); }
  if (flashT > 0){ ctx.save(); ctx.globalAlpha = Math.min(1, flashT/.22)*.85; ctx.fillStyle = PAPER; ctx.fillRect(0,0,viewW,viewH); ctx.restore(); }
  // hiệu ứng chuyển khu / chết (theo khung nhìn)
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,viewW,viewH); ctx.clip();
  if (state==='trans'){
    const k = tState<.45 ? tState/.45 : 1-(tState-.45)/.45;
    ctx.fillStyle=INK; ctx.fillRect(0,0,viewW*k,viewH);
  }
  if (state==='dying'){ ctx.fillStyle=INK; ctx.globalAlpha=Math.max(0,tState-.35)*2; ctx.fillRect(0,0,viewW,viewH); ctx.globalAlpha=1; }
  ctx.restore();
  // thanh mực (góc trên trái khung nhìn) + sổ tay khoa học (góc phải)
  drawExitArrow();
  if (reading) drawReading();
  drawBossCSOverlay();
  if (!bossCS){ drawManaHUD(); drawCombatHUD(); drawQuestHUD(); drawMathBossHUD(); drawMathHUD(); drawGearHUD(); drawBossLine(); }
  drawNotes();
  // nút loa (cạnh thanh mực): bấm hoặc nhấn M
  { const sx = 212, sy = 29; ctx.save(); ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(sx,sy,13,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=INK;
    ctx.beginPath(); ctx.moveTo(sx-7,sy-3); ctx.lineTo(sx-4,sy-3); ctx.lineTo(sx,sy-7); ctx.lineTo(sx,sy+7); ctx.lineTo(sx-4,sy+3); ctx.lineTo(sx-7,sy+3); ctx.closePath(); ctx.fill();
    if (SFX.muted){ line(sx+2,sy-4,sx+8,sy+4); line(sx+8,sy-4,sx+2,sy+4); }
    else { ctx.beginPath(); ctx.arc(sx+1,sy,4,-.8,.8); ctx.stroke(); ctx.beginPath(); ctx.arc(sx+1,sy,7.5,-.8,.8); ctx.stroke(); }
    ctx.restore(); }
  if (state==='dying' && bossLoss && tState>.5){
    const a = Math.min(1,(tState-.5)*2);
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=INK; ctx.fillRect(0,0,viewW,viewH);
    ctx.fillStyle=PAPER; ctx.textAlign='center'; ctx.font=`400 ${Math.min(30,viewW/16)}px ${HAND}`;
    ctx.fillText('Vua Mực đã nuốt chửng ngọn lửa…', viewW/2, viewH/2-10);
    ctx.font=`400 12px ${FONT}`; ctx.fillText('Làm lại trận Ngai Vua Mực', viewW/2, viewH/2+20);
    ctx.restore();
  }
  drawItemGetOverlay();
  if (leverAct && leverAct.lb > 0){ const h = viewH*.09*leverAct.lb; ctx.fillStyle = INK; ctx.fillRect(0,0,viewW,h); ctx.fillRect(0,viewH-h,viewW,h); }
  // viền khung nhìn
  ctx.strokeStyle=INK; ctx.lineWidth=2/S; ctx.strokeRect(0,0,viewW,viewH);

  if (touchUI){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    for (const b of BTN()){
      const held=[...ptrs.values()].includes(b.id);
      ctx.lineWidth=2.5; ctx.strokeStyle=INK; ctx.fillStyle=held?INK:PAPER;
      ctx.beginPath(); ctx.arc(b.x,b.y,34,0,Math.PI*2); ctx.fill(); ctx.stroke();
      text(b.l,b.x,b.y+7,20,700,'center',held?PAPER:INK);
    }
  }
}

resize();
let last=performance.now();
// Chọn nhạc nền theo trạng thái game
function pickMusic(){
  if (state==='title' || state==='end') return ['house',1];
  if (state==='story') return ['story',1];
  if (bossCS) return ['heart',1];
  if (boss && boss.engaged && !boss.dead) return boss.phase===4 ? ['heart',1] : ['boss', boss.phase];
  const th = LEVELS[lvl] && LEVELS[lvl].theme;
  if (mboss && mboss.engaged && !mboss.dead) return ['boss', 1 + Math.min(2, Math.floor((mboss.max - mboss.hp)/2))];
  return [{house:'house', basement:'basement', lab:'lab', fallen:'fallen', outside:'outside', math:'math'}[th] || 'house', 1];
}
function loop(now){ const dt=Math.min(1/30,(now-last)/1000); last=now;
  PERF.ema += ((dt*1000) - PERF.ema)*.05; if (state==='play'){ if (PERF.ema > 24){ PERF.slowT += dt; if (PERF.slowT > 2 && !PERF.auto){ PERF.auto = true; resize(); } } else PERF.slowT = Math.max(0, PERF.slowT - dt*.5); } update(dt); draw(); const [mn, mi] = pickMusic(); SFX.music(mn, mi); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
